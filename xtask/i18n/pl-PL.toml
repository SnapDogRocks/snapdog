# A number and a noun ("5 zones"). Key: the English singular. one, few, many, other follow CLDR;
# a language without `few` and `many` uses `other`.
[counted]
"zone" = { one = "strefa", few = "strefy", many = "stref", other = "stref" }
"client" = { one = "klient", few = "klienty", many = "klientów", other = "klientów" }
"station" = { one = "stacja", few = "stacje", many = "stacji", other = "stacji" }
"minute" = { one = "minuta", few = "minuty", many = "minut", other = "minut" }
"API key" = { one = "klucz API", few = "klucze API", many = "kluczy API", other = "kluczy API" }

# A heading before a number ("Zone 3"). Key: the English heading.
[labels]
"Station" = "Stacja"
"Zone" = "Strefa"
"Client" = "Klient"
"API key" = "Klucz API"

# The start of the product line ("Product DB v13 · ...").
[product_db]
prefix = "Baza produktu"
