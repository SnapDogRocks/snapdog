# A number and a noun ("5 zones"). Key: the English singular. one, few, many, other follow CLDR;
# a language without `few` and `many` uses `other`.
[counted]
"zone" = { one = "zona", other = "zone" }
"client" = { one = "client", other = "client" }
"station" = { one = "stazione", other = "stazioni" }
"minute" = { one = "minuto", other = "minuti" }
"API key" = { one = "chiave API", other = "chiavi API" }

# A heading before a number ("Zone 3"). Key: the English heading.
[labels]
"Station" = "Stazione"
"Zone" = "Zona"
"Client" = "Client"
"API key" = "Chiave API"

# The start of the product line ("Product DB v13 · ...").
[product_db]
prefix = "DB prodotto"
