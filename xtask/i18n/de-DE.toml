# A number and a noun ("5 zones"). Key: the English singular. one, few, many, other follow CLDR;
# a language without `few` and `many` uses `other`.
[counted]
"zone" = { one = "Zone", other = "Zonen" }
"client" = { one = "Client", other = "Clients" }
"station" = { one = "Sender", other = "Sender" }
"minute" = { one = "Minute", other = "Minuten" }
"API key" = { one = "API-Key", other = "API-Keys" }

# A heading before a number ("Zone 3"). Key: the English heading.
[labels]
"Station" = "Station"
"Zone" = "Zone"
"Client" = "Client"
"API key" = "API-Key"

# The start of the product line ("Product DB v13 · ...").
[product_db]
prefix = "Produkt-DB"
