# A number and a noun ("5 zones"). Key: the English singular. one, few, many, other follow CLDR;
# a language without `few` and `many` uses `other`.
[counted]
"zone" = { one = "zona", other = "zonas" }
"client" = { one = "cliente", other = "clientes" }
"station" = { one = "emisora", other = "emisoras" }
"minute" = { one = "minuto", other = "minutos" }
"API key" = { one = "clave API", other = "claves API" }

# A heading before a number ("Zone 3"). Key: the English heading.
[labels]
"Station" = "Emisora"
"Zone" = "Zona"
"Client" = "Cliente"
"API key" = "Clave API"

# The start of the product line ("Product DB v13 · ...").
[product_db]
prefix = "BD de producto"
