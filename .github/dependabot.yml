version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # semver-major-days is not permitted for github-actions. If it stands
    # here, Dependabot rejects the ENTIRE file and not a single update runs
    # any more, not even a security update.
    cooldown:
      default-days: 3
    groups:
      actions-dependencies:
        update-types:
          - minor
          - patch

  # An entry of its own: the toolchain affects every build and never shares a
  # pull request. `rust-toolchain` is missing from GitHub's ecosystem table but
  # is in the published schema (json.schemastore.org/dependabot-2.0.json). The
  # Rust images in the Dockerfiles and release.yml have to follow by hand;
  # .github/scripts/test_rust_toolchain.py fails until they do.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:05"
    target-branch: main
    commit-message:
      prefix: chore
    open-pull-requests-limit: 1
    labels:
      - dependencies
    cooldown:
      default-days: 14

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
    labels:
      - dependencies
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: chore
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # typescript is pinned to ~6.0 in webui/package.json because
      # typescript-eslint's peer bound is <6.1.0 (parallel workstream).
      # Without this, Dependabot reliably proposes a version that breaks
      # type-aware linting.
      - dependency-name: typescript
        versions: ['>=6.1']

  - package-ecosystem: npm
    directory: /demo-backend
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: chore
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
