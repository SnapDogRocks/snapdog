version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: chore
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint's peer bound is `typescript: >=4.8.4 <6.1.0`; a
      # bump to 6.1+ would make lint's type-aware rules unable to install
      # at all. Raise together with typescript-eslint once it widens the
      # range (see references/typescript.md in the repo-standard skill).
      - dependency-name: typescript
        versions: [">=6.1"]

  - package-ecosystem: npm
    directory: /demo-backend
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: chore
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
