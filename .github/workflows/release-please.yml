name: Release Please

on:
  push:
    branches: [main]

# Never cancel a running instance: the `rp` step creates the tag and the draft release and
# the last step dispatches the build. A cancellation between the two would leave a tag and a
# draft without a build, and the next run would not dispatch it (see the comment at the
# dispatch step). With `false`, GitHub keeps at most one pending run per group and replaces
# older pending ones, which is fine because release-please works from repository state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The app credentials live in the protected environment, not as repository
    # secrets reachable by every workflow in the repository.
    environment: release
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with a GitHub App token, not the default
      # GITHUB_TOKEN. GitHub blocks GITHUB_TOKEN-authored PRs/pushes from
      # triggering other workflows (recursion guard), so ci.yml never ran on the
      # release PR and its required checks stayed stuck. An App token is a real
      # actor, so its pushes DO fire ci.yml.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          # The client id is public information, so it is a variable. A secret
          # cannot be shown in an error message and makes every check blind.
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please bumps the version in Cargo.toml (via extra-files) but never
      # touches Cargo.lock, so main's lockfile would lag one release and dirty every
      # fresh checkout (and now fail the `--locked` CI guard). Sync the lock into the
      # open release PR so merging keeps main current. This push uses the App
      # token so it re-triggers ci.yml on the *new* PR head —
      # required checks are evaluated on the latest commit, so a GITHUB_TOKEN
      # push here would leave the PR blocked. It only pushes to the PR branch
      # (never main), so release-please.yml does not re-run: no loop.
      - name: Sync Cargo.lock into the release PR
        if: ${{ steps.rp.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "$PR_JSON" | jq -r .headBranchName)
          git clone --branch "$branch" --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rp-lock
          cd rp-lock
          # The clone's rust-toolchain.toml names the toolchain; install exactly that
          # one instead of relying on the runner image's preinstalled cargo.
          rustup toolchain install
          cargo update --workspace -q
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the release version."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync Cargo.lock to the release version" -- Cargo.lock
            git push origin "HEAD:$branch"
          fi
      # `release_created` is true only for a release created in this very run. For a tag or
      # release that already exists, release-please (src/manifest.ts,
      # createReleasesForPullRequest) catches a DuplicateReleaseError, relabels the pull
      # request as tagged and rethrows, so the `rp` step fails and nothing is dispatched. If
      # the pull request was already relabelled, the next run finds no candidate at all. In
      # both cases a draft is left without a build; the next step reports it.
      - name: Start the one release build for the new draft
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          # Operational switch for deliberately staged releases. An absent
          # variable preserves the complete release as the safe default.
          RELEASE_SCOPE: ${{ vars.RELEASE_SCOPE || 'full' }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          # release-please creates the tag and a draft release. release.yml has no
          # tag/release trigger: this is the single automatic dispatch point.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
            -f scope="$RELEASE_SCOPE"
      # Safety net for a draft left without a build (an interrupted earlier run): fail
      # loudly instead of staying silent. It does not dispatch by itself, a release build
      # is started deliberately: `gh workflow run release.yml --ref <tag>`.
      - name: Check that every draft release has a release build
        if: ${{ always() && steps.app-token.outcome == 'success' && steps.rp.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          drafts=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
            --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')
          [ -n "$drafts" ] || exit 0
          built=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
            --limit 100 --json headBranch --jq '.[].headBranch')
          missing=0
          for tag in $drafts; do
            if ! grep -qxF -- "$tag" <<<"$built"; then
              echo "::error::Draft release $tag has no release.yml run. Start it with: gh workflow run release.yml --ref $tag"
              missing=1
            fi
          done
          exit "$missing"
