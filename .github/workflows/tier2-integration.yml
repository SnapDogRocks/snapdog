# Tier-2 tests against real services (Navidrome, snapserver, mosquitto), shared by
# ci.yml (on relevant changes) and nightly.yml (every night) so the two cannot drift.
name: Tier-2 integration tests

on:
  workflow_call:
    inputs:
      report-name:
        description: Name of the uploaded nextest report artifact.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  tier2:
    name: Tier-2 (real services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      navidrome:
        image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
        ports:
          - 4533:4533
        env:
          ND_SCANSCHEDULE: "0"
          ND_LOGLEVEL: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install Rust toolchain
        # Version, components and profile come from rust-toolchain.toml.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Skip WebUI build (placeholder is generated by snapdog/build.rs)
        shell: bash
        run: echo "SKIP_WEBUI_BUILD=1" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: Install snapserver + mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y snapserver libasound2-dev libavahi-compat-libdnssd-dev mosquitto
          printf "listener 1883\nallow_anonymous true\n" | sudo tee /etc/mosquitto/conf.d/ci.conf
          sudo systemctl restart mosquitto
      - name: Create test env
        run: |
          cat > .env.test << EOF
          SNAPDOG_TEST_SUBSONIC_URL=http://localhost:4533
          SNAPDOG_TEST_SUBSONIC_USERNAME=admin
          SNAPDOG_TEST_SUBSONIC_PASSWORD=admin
          SNAPDOG_TEST_MQTT_BROKER=localhost:1883
          SNAPDOG_TEST_MQTT_USERNAME=
          SNAPDOG_TEST_MQTT_PASSWORD=
          EOF
      - name: Run tier-2 integration tests (process feature)
        # nextest applies the serial `tier2-real-service` group + tier-2-only
        # retries from .config/nextest.toml; each test loud-skips if its service
        # is unavailable. Covers integration (Subsonic/MQTT), the snapcast JSON-RPC
        # firewall, the real-snapserver e2e (IT-T56), and real-mosquitto (IT-T32).
        run: |
          cargo nextest run --locked -p snapdog --profile ci --no-default-features --features snapcast-process \
            -E 'binary(integration) | binary(snapcast_rpc) | binary(snapserver_e2e) | binary(mqtt_tier2)'
      - name: Upload tier-2 test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: ${{ inputs.report-name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
