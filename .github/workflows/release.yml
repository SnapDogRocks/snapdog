name: Release

on:
  # release-please creates the tag plus a draft and dispatches this workflow exactly
  # once. Never add a tag or release event here: either would duplicate the build.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    # Drafts are visible only to callers with push access. Keep this permission
    # job-local; the resolver itself performs read-only API requests.
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      revision: ${{ steps.meta.outputs.revision }}
      created: ${{ steps.meta.outputs.created }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse version
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release workflow must run from a SemVer tag (vX.Y.Z), got: $GITHUB_REF"
            exit 1
          fi
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          REVISION=$(git rev-parse HEAD)
          CREATED=$(git show -s --format=%cI HEAD)
          release=$(python3 .github/scripts/release_state.py resolve "$GITHUB_REPOSITORY" "$TAG")
          PRERELEASE=$(jq -r .prerelease <<<"$release")
          {
            echo "release_id=$(jq -r .id <<<"$release")"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "revision=${REVISION}"
            echo "created=${CREATED}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

  webui:
    name: Build WebUI
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      # The Next.js static export is target-independent — build it ONCE here and share
      # it with every build/deb job via the webui-out artifact, instead of re-running
      # npm in each of the 5 build-matrix targets (snapdog embeds it via rust-embed).
      - name: Build WebUI (static export)
        working-directory: webui
        run: npm ci && npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: webui-out
          path: webui/out
          if-no-files-found: error

  knxprod:
    name: Build .knxprod
    needs: [meta, webui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libasound2-dev libavahi-compat-libdnssd-dev
      # snapdog (an xtask dependency) embeds the WebUI via rust-embed; reuse the export so
      # its build.rs does not invoke npm here.
      - name: Fetch pre-built WebUI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: webui-out
          path: webui/out
      # A release must never silently downgrade to an unsigned ETS database.
      - name: Generate & sign .knxprod
        env:
          ETS_SIGNING_KEY: ${{ secrets.ETS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$ETS_SIGNING_KEY" || { echo "::error::ETS_SIGNING_KEY is required for releases"; exit 1; }
          umask 077
          printf '%s' "$ETS_SIGNING_KEY" > "$RUNNER_TEMP/ets-key.pem"
          export SNAPDOG_ETS_KEY="$RUNNER_TEMP/ets-key.pem"
          cargo run -p xtask -- knxprod
          rm -f "$RUNNER_TEMP/ets-key.pem"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: knxprod
          path: knx/snapdog.knxprod
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: [meta, webui, knxprod]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    # Release artifacts favor build throughput over Thin-LTO's small runtime gain.
    # Keep the profile default for local/non-CI release builds.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
    # Linux targets build inside a Debian bookworm container so the binaries link against
    # bookworm's glibc (2.36) — matching the Docker RUNTIME_IMAGE (so the release `docker`
    # job can reuse them with no second compile) and keeping the tarballs/.debs portable to
    # Debian 12+. Native per-arch (amd64 + arm64 runners); no cross-compilation.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1.97.0-bookworm@sha256:7d0723df719e7f213b69dc7c8c595985c3f4b060cfbee4f7bc0e347a86fe3b6a
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: rust:1.97.0-bookworm@sha256:7d0723df719e7f213b69dc7c8c595985c3f4b060cfbee4f7bc0e347a86fe3b6a
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      # In the bookworm container Rust 1.97 is preinstalled; only the mac/windows runners
      # need rustup plus the cross target installed.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        if: matrix.container == ''
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: matrix.container != ''
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            cmake pkg-config libasound2-dev libavahi-compat-libdnssd-dev
      # Reuse the WebUI built once in the `webui` job. With webui/out present,
      # snapdog's build.rs early-returns instead of invoking npm — no Node on this runner.
      - name: Fetch pre-built WebUI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: webui-out
          path: webui/out
      - name: Verify WebUI present
        shell: bash
        run: test -f webui/out/index.html || { echo "::error::webui/out/index.html missing — build.rs would fall back to npm, but no Node is installed here"; exit 1; }
      # Reuse the (signed-if-key) .knxprod built once in the `knxprod` job; snapdog embeds
      # it via include_bytes!, so the download must land before the build.
      - name: Fetch pre-built .knxprod
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: knxprod
          path: knx
      - name: Build release
        run: cargo build --release --timings --target ${{ matrix.target }} -p snapdog -p snapdog-client
      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: cargo-timings-${{ matrix.target }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: warn
      - name: Package binary
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="snapdog-${TAG}-${TARGET}"
          mkdir "$archive"
          cp "target/${TARGET}/release/snapdog" "$archive/" 2>/dev/null || \
          cp "target/${TARGET}/release/snapdog.exe" "$archive/"
          cp "target/${TARGET}/release/snapdog-client" "$archive/" 2>/dev/null || \
          cp "target/${TARGET}/release/snapdog-client.exe" "$archive/" 2>/dev/null || true
          cp LICENSE README.md "$archive/" 2>/dev/null || true
          cp snapdog.example.toml "$archive/" 2>/dev/null || true
          mkdir -p "$archive/packaging"
          cp snapdog/systemd/snapdog.service snapdog/debian/snapdog.default \
            snapdog-client/systemd/snapdog-client.service \
            snapdog-client/debian/snapdog-client.default "$archive/packaging/"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "${archive}.zip" "$archive"
            sha256sum "${archive}.zip" > "${archive}.zip.sha256"
          else
            tar czf "${archive}.tar.gz" "$archive"
            sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: snapdog-${{ matrix.target }}
          path: |
            snapdog-*.tar.gz
            snapdog-*.tar.gz.sha256
            snapdog-*.zip
            snapdog-*.zip.sha256

  macos-app:
    name: macOS App (.dmg)
    needs: [meta, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.1
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            # download-artifact doesn't support retry natively, use gh CLI
            gh run download ${{ github.run_id }} \
              --pattern "snapdog-*-apple-darwin" \
              --dir artifacts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"
          KEYCHAIN_PASSWORD="actions"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm cert.p12
      - name: Create universal binary
        run: |
          tar xzf artifacts/snapdog-aarch64-apple-darwin/snapdog-*-aarch64-apple-darwin.tar.gz
          tar xzf artifacts/snapdog-x86_64-apple-darwin/snapdog-*-x86_64-apple-darwin.tar.gz
          ARM_BIN=$(find . -name "snapdog" -path "*aarch64-apple-darwin*" -not -name "*.tar.gz" | head -1)
          X86_BIN=$(find . -name "snapdog" -path "*x86_64-apple-darwin*" -not -name "*.tar.gz" | head -1)
          if [ -z "$ARM_BIN" ] || [ -z "$X86_BIN" ]; then
            echo "::error::Could not find binaries: ARM='$ARM_BIN' X86='$X86_BIN'"
            find . -name "snapdog" -type f
            exit 1
          fi
          lipo -create "$ARM_BIN" "$X86_BIN" -output snapdog-universal
          file snapdog-universal
      - name: Build Swift app
        working-directory: macos-helper/SnapDogServer
        run: |
          xcodebuild -project "SnapDog Server.xcodeproj" \
            -scheme "SnapDog Server" \
            -configuration Release \
            -arch arm64 -arch x86_64 \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION=${{ needs.meta.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ needs.meta.outputs.version }} \
            CODE_SIGN_IDENTITY="Developer ID Application: Fabian Schmieder (${{ secrets.APPLE_TEAM_ID }})" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            build
      - name: Assemble and sign app bundle
        env:
          IDENTITY: "Developer ID Application: Fabian Schmieder (${{ secrets.APPLE_TEAM_ID }})"
        run: |
          APP="SnapDog Server.app"
          BUILD_APP="macos-helper/SnapDogServer/build/Build/Products/Release/SnapDog Server.app"
          cp -R "$BUILD_APP" "$APP"
          mkdir -p "$APP/Contents/Helpers"
          cp snapdog-universal "$APP/Contents/Helpers/snapdog"
          chmod +x "$APP/Contents/Helpers/snapdog"

          sign() { codesign --force --options runtime --timestamp --sign "$IDENTITY" "$@"; }

          # Sign inside-out. Sparkle ships its nested helpers PRE-signed by the Sparkle
          # project (NOT our Developer ID) and xcodebuild does not re-sign them, so
          # notarization rejects them ("not signed with a valid Developer ID" + "no secure
          # timestamp" — MAC-T24). Re-sign every nested Sparkle Mach-O/bundle ourselves,
          # deepest first, then the framework, the helper, and finally the outer app.
          # --timestamp is mandatory for notarization; --deep is intentionally avoided
          # (Apple-deprecated) in favour of this explicit inside-out pass.
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$FW" ]; then
            V="$FW/Versions/B"
            [ -e "$V/XPCServices/Downloader.xpc" ] && sign "$V/XPCServices/Downloader.xpc"
            [ -e "$V/XPCServices/Installer.xpc" ]  && sign "$V/XPCServices/Installer.xpc"
            [ -e "$V/Autoupdate" ]                 && sign "$V/Autoupdate"
            [ -e "$V/Updater.app" ]                && sign "$V/Updater.app"
            sign "$FW"
          fi
          sign "$APP/Contents/Helpers/snapdog"
          sign "$APP"
          # Guard: fails this job before a broken DMG can ship. (Insufficient on its own —
          # it passes structurally-valid non-Developer-ID signatures — hence the explicit
          # re-signing above; notarization is the real strictness gate.)
          codesign --verify --deep --strict "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Sealed" || true
      - name: Create DMG
        run: |
          VERSION=${{ needs.meta.outputs.version }}
          DMG="SnapDog-Server-${VERSION}.dmg"
          brew install create-dmg
          create-dmg \
            --volname "SnapDog Server" \
            --background "assets/dmg-background.png" \
            --window-size 600 400 \
            --icon "SnapDog Server.app" 150 200 \
            --app-drop-link 450 200 \
            --icon-size 80 \
            --no-internet-enable \
            "$DMG" \
            "SnapDog Server.app"
          test -f "$DMG"
      - name: Notarize DMG
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          VERSION=${{ needs.meta.outputs.version }}
          DMG="SnapDog-Server-${VERSION}.dmg"
          echo "$KEY_P8" | base64 --decode > AuthKey.p8
          # On a rejected submission notarytool exits non-zero but prints only the status,
          # not the per-file reasons — fetch the detailed log so the failure is diagnosable
          # straight from the CI output instead of needing a manual `notarytool log` run.
          set +e
          xcrun notarytool submit "$DMG" \
            --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --timeout 600 2>&1 | tee notary-submit.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            SUBMIT_ID=$(awk '/id:/{print $2; exit}' notary-submit.txt)
            echo "::error::Notarization failed (rc=$rc). Detailed log for ${SUBMIT_ID}:"
            [ -n "$SUBMIT_ID" ] && xcrun notarytool log "$SUBMIT_ID" \
              --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID" || true
            rm -f AuthKey.p8
            exit 1
          fi
          xcrun stapler staple "$DMG"
          rm AuthKey.p8
          shasum -a 256 "$DMG" > "${DMG}.sha256"
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true
      - name: Generate Sparkle appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          IS_PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          VERSION=${{ needs.meta.outputs.version }}
          TAG=${{ needs.meta.outputs.tag }}
          DMG="SnapDog-Server-${VERSION}.dmg"

          # Beta channel: a GitHub prerelease, or a tag carrying a pre-release identifier.
          # Stable items carry no channel (offered to everyone); a beta item is only offered
          # to updaters that opted into the "beta" channel (RFC MAC-0006 MAC-T23).
          CHANNEL_LINE=""
          if [ "$IS_PRERELEASE" = "true" ] || printf '%s' "$TAG" | grep -qiE '\-(beta|rc|alpha|pre)'; then
            CHANNEL_LINE=$'      <sparkle:channel>beta</sparkle:channel>\n'
            echo "Appcast item tagged for the beta channel"
          fi

          # Find sign_update from the Sparkle SPM package resolved during xcodebuild
          SIGN_TOOL=$(find macos-helper/SnapDogServer/build/SourcePackages -name "sign_update" -path "*Sparkle*" 2>/dev/null | head -1)
          if [ -z "$SIGN_TOOL" ]; then
            SIGN_TOOL=$(find ~/Library/Developer/Xcode/DerivedData -name "sign_update" -path "*Sparkle*" 2>/dev/null | head -1)
          fi
          if [ -z "$SIGN_TOOL" ]; then
            echo "::error::sign_update tool not found"
            exit 1
          fi

          # Write key to temp file for signing
          echo "$SPARKLE_KEY" > /tmp/sparkle_key
          SIGNATURE=$("$SIGN_TOOL" "$DMG" --ed-key-file /tmp/sparkle_key | grep "edSignature" | cut -d'"' -f2)
          rm /tmp/sparkle_key

          if [ -z "$SIGNATURE" ]; then
            echo "::error::Failed to generate EdDSA signature"
            exit 1
          fi

          LENGTH=$(stat -f%z "$DMG")

          printf '<?xml version="1.0" encoding="utf-8"?>\n<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">\n  <channel>\n    <title>SnapDog Server</title>\n    <item>\n      <title>Version %s</title>\n%s      <sparkle:version>%s</sparkle:version>\n      <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>\n      <enclosure url="https://github.com/SnapDogRocks/snapdog/releases/download/%s/%s"\n        sparkle:edSignature="%s"\n        length="%s"\n        type="application/octet-stream"/>\n    </item>\n  </channel>\n</rss>\n' "$VERSION" "$CHANNEL_LINE" "$VERSION" "$TAG" "$DMG" "$SIGNATURE" "$LENGTH" > appcast.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: snapdog-macos-app
          path: |
            SnapDog-Server-*.dmg
            SnapDog-Server-*.dmg.sha256
            appcast.xml

  build-deb:
    name: Debian ${{ matrix.pkg }} (${{ matrix.arch }})
    needs: [meta, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: snapdog,        arch: amd64, target: x86_64-unknown-linux-gnu }
          - { pkg: snapdog,        arch: arm64, target: aarch64-unknown-linux-gnu }
          - { pkg: snapdog-client, arch: amd64, target: x86_64-unknown-linux-gnu }
          - { pkg: snapdog-client, arch: arm64, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.7.0 --locked
      # Reuse the binary already compiled by the `build` job (bookworm glibc, so the .deb
      # runs on Debian 12+ and matching distros) — no second snapdog compile, no WebUI
      # rebuild, and no native arm64 runner: cargo-deb sets Architecture from --target, so
      # both arches package on amd64.
      - name: Fetch pre-built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: snapdog-${{ matrix.target }}
          path: dist
      - name: Stage binary where cargo-deb expects it
        run: |
          tar xzf dist/snapdog-*-${{ matrix.target }}.tar.gz -C dist
          bin=$(find dist -type f -name '${{ matrix.pkg }}' | head -1)
          test -n "$bin" || { echo "::error::${{ matrix.pkg }} binary not in artifact"; find dist -type f; exit 1; }
          install -Dm755 "$bin" "target/${{ matrix.target }}/release/${{ matrix.pkg }}"
      # --no-strip: the binaries are already stripped ([profile.release] strip = true),
      # and host strip/objcopy on this amd64 runner can't process the aarch64 ELF.
      # cargo-deb writes to target/debian/ regardless of --target (arch is in the filename).
      - name: Package .deb
        run: cargo deb -p ${{ matrix.pkg }} --target ${{ matrix.target }} --no-build --no-strip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deb-${{ matrix.pkg }}-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  verify-release-assets:
    name: Verify release assets and .deb installs
    runs-on: ubuntu-latest
    needs: [meta, build, build-deb, knxprod, macos-app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only collect the current release outputs. In particular, the signed APT
      # repository contains historical .debs and must never enter this asset set.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: snapdog-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: deb-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: knxprod
          path: artifacts/knxprod
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.tar.gz.sha256" -o -name "*.zip" -o -name "*.zip.sha256" -o -name "*.dmg" -o -name "*.dmg.sha256" -o -name "*.deb" -o -name "*.knxprod" \) -exec cp {} release-assets/ \;
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.knxprod' | wc -l)" -eq 1
          cp ../deploy/docker-compose.yml ./docker-compose.yml
          cp ../deploy/snapdog.env.example ./snapdog.env.example
          sed -i \
            -e "s|SNAPDOG_IMAGE=.*|SNAPDOG_IMAGE=ghcr.io/snapdogrocks/snapdog:${{ needs.meta.outputs.tag }}|" \
            -e "s|UPDATER_IMAGE=.*|UPDATER_IMAGE=ghcr.io/snapdogrocks/snapdog-updater:${{ needs.meta.outputs.tag }}|" \
            snapdog.env.example
          grep -Fx "SNAPDOG_IMAGE=ghcr.io/snapdogrocks/snapdog:${{ needs.meta.outputs.tag }}" snapdog.env.example
          grep -Fx "UPDATER_IMAGE=ghcr.io/snapdogrocks/snapdog-updater:${{ needs.meta.outputs.tag }}" snapdog.env.example
          for checksum in ./*.sha256; do sha256sum --check "$checksum"; done
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS .
          sha256sum --check SHA256SUMS
      - name: Prove .deb files contain the already-built binaries
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}; target=${pair#*:}
            mkdir -p "compare/${arch}/archive"
            tar xzf "release-assets/snapdog-${TAG}-${target}.tar.gz" -C "compare/${arch}/archive"
            for pkg in snapdog snapdog-client; do
              deb=$(find release-assets -name "${pkg}_*_${arch}.deb" -print -quit)
              test -n "$deb"
              mkdir -p "compare/${arch}/${pkg}"
              dpkg-deb -x "$deb" "compare/${arch}/${pkg}"
              built=$(find "compare/${arch}/archive" -type f -name "$pkg" -print -quit)
              cmp "$built" "compare/${arch}/${pkg}/usr/bin/${pkg}"
            done
          done
      - name: Smoke-test direct .deb installation
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/release-assets:/packages:ro" \
            debian:12-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 sh -euxc '
            printf "#!/bin/sh\nexit 101\n" >/usr/sbin/policy-rc.d
            apt-get update
            apt-get install -y /packages/*_amd64.deb
            snapdog --version
            snapdog-client --version
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: verified-release-assets
          path: release-assets
          if-no-files-found: error

  smoke-homebrew:
    name: Smoke-test Homebrew packages
    needs: [meta, build]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: snapdog-${{ runner.arch == 'ARM64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          path: artifacts
      - name: Install both formulas from the local, measured artifact
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          archive=$(find "$PWD/artifacts" -name '*.tar.gz' -print -quit)
          test -n "$archive"
          sha=$(shasum -a 256 "$archive" | awk '{print $1}')
          # Homebrew requires formulae to live in a tap, even for local archives.
          # A run-specific local tap never changes the public Homebrew tap.
          tap="snapdog-smoke/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for pkg in snapdog snapdog-client; do
            if brew list --versions "$pkg" >/dev/null 2>&1; then
              echo "::error::Smoke test requires a clean runner: $pkg is already installed"
              exit 1
            fi
          done
          brew tap-new --no-git "$tap"
          trap 'brew untap "$tap"' EXIT
          tap_dir=$(brew --repository "$tap")
          for pkg in snapdog snapdog-client; do
            case "$pkg" in snapdog) formula=Snapdog;; snapdog-client) formula=SnapdogClient;; esac
            cat > "${tap_dir}/Formula/${pkg}.rb" <<EOF
          class ${formula} < Formula
            version "${VERSION}"
            url "file://${archive}"
            sha256 "${sha}"
            def install
              bin.install "${pkg}"
            end
            test do
              assert_match version.to_s, shell_output("#{bin}/${pkg} --version")
            end
          end
          EOF
            brew install --formula "$tap/$pkg"
            brew test "$tap/$pkg"
            brew uninstall "$tap/$pkg"
          done

  smoke-aur:
    name: Smoke-test AUR packages
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: snapdog-x86_64-unknown-linux-gnu
          path: artifacts
      - name: Build and install both PKGBUILDs from the local release artifact
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          archive=$(find artifacts -name '*.tar.gz' -print -quit)
          sha=$(sha256sum "$archive" | awk '{print $1}')
          mkdir aur-smoke
          cp "$archive" aur-smoke/
          for pkg in snapdog snapdog-client; do
            mkdir "aur-smoke/$pkg"
            cp "aur/$pkg/PKGBUILD" "aur-smoke/$pkg/"
            cp "$archive" "aur-smoke/$pkg/snapdog-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "aur-smoke/$pkg/PKGBUILD"
            sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${sha}')/" "aur-smoke/$pkg/PKGBUILD"
            if [ "$pkg" = snapdog ]; then
              aux=$(sha256sum snapdog/systemd/snapdog.service snapdog/debian/snapdog.default snapdog.example.toml | awk '{printf "\047%s\047 ", $1}')
            else
              aux=$(sha256sum snapdog-client/systemd/snapdog-client.service snapdog-client/debian/snapdog-client.default | awk '{printf "\047%s\047 ", $1}')
            fi
            PKGBUILD="aur-smoke/$pkg/PKGBUILD" AUX="$aux" python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path(os.environ["PKGBUILD"])
          text = re.sub(r"sha256sums=\(.*?\)", f"sha256sums=({os.environ['AUX'].strip()})", path.read_text(), flags=re.S)
          path.write_text(text)
          PY
          done
          docker run --rm -v "$PWD/aur-smoke:/work" \
            archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d sh -euxc '
            pacman -Syu --noconfirm alsa-lib avahi
            useradd -m builder
            chown -R builder:builder /work
            for pkg in snapdog snapdog-client; do
              su builder -c "cd /work/$pkg && makepkg --verifysource && makepkg --noconfirm"
              pacman -U --noconfirm /work/$pkg/*.pkg.tar.zst
              "$pkg" --version
              pacman -R --noconfirm "$pkg"
            done
          '

  upload-release-artifacts:
    name: Upload verified assets to draft
    runs-on: ubuntu-latest
    needs: [meta, verify-release-assets, smoke-homebrew, smoke-aur, smoke-apt]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: verified-release-assets
          path: release-assets
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.meta.outputs.tag }}" ./release-assets/* \
            --repo "${{ github.repository }}"
      - name: Verify every remote asset from a clean directory
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir remote
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir remote
          diff -u <(cd release-assets && sha256sum ./* | sort) <(cd remote && sha256sum ./* | sort)

  publish-release:
    name: Publish verified release
    needs: [meta, upload-release-artifacts, docker, updater-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish draft atomically after all gates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_ID: ${{ needs.meta.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_state.py verify "$GITHUB_REPOSITORY" "$TAG" "$RELEASE_ID" draft > /dev/null
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false > /dev/null
          python3 .github/scripts/release_state.py verify "$GITHUB_REPOSITORY" "$TAG" "$RELEASE_ID" published > /dev/null

  update-appcast:
    name: Update Sparkle Appcast
    needs: [meta, macos-app, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: snapdog-macos-app
          path: artifacts
      - name: Merge into the existing appcast and upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler@4.127.1
          # A missing/unreadable current appcast is an error: silently replacing it would
          # discard the other update channel and make recovery harder.
          wrangler r2 object get snapdog-updates/helper/appcast.xml \
            --file existing-appcast.xml --remote
          test -s existing-appcast.xml
          python3 macos-helper/merge-appcast.py artifacts/appcast.xml existing-appcast.xml merged-appcast.xml
          wrangler r2 object put snapdog-updates/helper/appcast.xml \
            --file merged-appcast.xml \
            --content-type "application/xml" \
            --remote

  update-homebrew:
    name: Update Homebrew Tap
    needs: [meta, publish-release, verify-release-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The tap credentials live in the protected environment, not as a repository
    # secret every workflow can read.
    environment: release
    env:
      TAP_REPO: SnapDogRocks/homebrew-tap
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: verified-release-assets
          path: artifacts

      - name: Split the tap coordinates
        id: tap
        run: |
          set -euo pipefail
          echo "owner=${TAP_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TAP_REPO##*/}" >> "$GITHUB_OUTPUT"

      # An installation token lives one hour. Opening the pull request fits
      # inside that; waiting for the tap's qualification afterwards may not, so
      # the merge mints a second one rather than stretching this one.
      - name: Mint a tap token for the pull request
        id: token-open
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ steps.tap.outputs.owner }}
          repositories: ${{ steps.tap.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Verify the token and measure the identity the tap will see
        id: bot
        env:
          GH_TOKEN: ${{ steps.token-open.outputs.token }}
          APP_SLUG: ${{ steps.token-open.outputs.app-slug }}
        run: |
          set -euo pipefail
          mapfile -t reach < <(gh api /installation/repositories \
            --jq '.repositories[].full_name' | sort)
          printf 'the token reaches: %s\n' "${reach[*]:-nothing}"
          if [[ ${#reach[@]} -ne 1 || "${reach[0]}" != "$TAP_REPO" ]]; then
            echo "::error::TAP001 the tap token reaches ${#reach[@]} repositories, expected only ${TAP_REPO}"
            exit 1
          fi
          # The bot's own public user record. An installation token has no
          # personal user behind it, so /user would answer about nobody.
          login="${APP_SLUG}[bot]"
          id=$(gh api "/users/${login}" --jq .id)
          if [[ -z "$id" || "$id" == null ]]; then
            echo "::error::TAP002 no public user record for ${login}"
            exit 1
          fi
          echo "login=$login" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Open a formula update pull request
        id: update
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token-open.outputs.token }}
          TAP_TOKEN: ${{ steps.token-open.outputs.token }}
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          set -euo pipefail
          # Both formulas install from the same macOS archive per architecture;
          # the release builds one darwin tarball that carries both binaries.
          x64=$(sha256sum "artifacts/snapdog-${TAG}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)
          arm=$(sha256sum "artifacts/snapdog-${TAG}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" \
            "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"

          # Never walk a release backwards. The formulas carry no explicit
          # `version` line, because `brew audit --strict` rejects one that
          # repeats what Homebrew scans from the URL, so the published version is
          # read from that URL exactly as Homebrew reads it.
          if [[ -f Formula/snapdog.rb ]]; then
            current=$(sed -nE 's#.*/releases/download/v([^/]+)/.*#\1#p' Formula/snapdog.rb | sort -u)
            if [[ $(printf '%s\n' "$current" | grep -c .) -ne 1 ]]; then
              echo "::error::TAP003 could not read one version from the published formula"
              exit 1
            fi
            newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)
            if [[ "$current" == "$VERSION" || "$newest" == "$current" ]]; then
              echo "the tap already carries ${current}; leaving it alone"
              echo 'pr=' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          install -d Formula
          write_formula() {
            local file=$1 klass=$2 binary=$3 description=$4
            cat > "Formula/${file}" <<EOF
          class ${klass} < Formula
            desc "${description}"
            homepage "https://github.com/SnapDogRocks/snapdog"
            license "GPL-3.0-only"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/SnapDogRocks/snapdog/releases/download/${TAG}/snapdog-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${x64}"
              else
                url "https://github.com/SnapDogRocks/snapdog/releases/download/${TAG}/snapdog-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${arm}"
              end
            end

            def install
              bin.install "${binary}"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/${binary} --version")
            end
          end
          EOF
          }
          write_formula snapdog.rb Snapdog snapdog \
            "Multi-zone audio controller with AirPlay, Snapcast, MQTT, and KNX"
          write_formula snapdog-client.rb SnapdogClient snapdog-client \
            "SnapDog multiroom audio client"

          if git diff --quiet -- Formula; then
            echo "the formulas are already current at ${VERSION}"
            echo 'pr=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="release/snapdog-${VERSION}-${GITHUB_RUN_ID}"
          # Recorded before the push, so the cleanup step below can remove the
          # branch even when this step dies part way through.
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          git config user.name "$BOT_LOGIN"
          git config user.email "$BOT_EMAIL"
          git add Formula/snapdog.rb Formula/snapdog-client.rb
          git commit -m "snapdog ${VERSION}"
          git push -u origin "$branch"
          pr=$(gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
            --title "snapdog ${VERSION}" \
            --body "Automated update from the verified ${TAG} release assets. The formulas are merged only after every tap qualification lane passes.")
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          # Recorded so the merge step can prove nothing was pushed onto the
          # branch while the qualification ran.
          echo "head=$(gh pr view "$pr" --repo "$TAP_REPO" --json headRefOid --jq .headRefOid)" \
            >> "$GITHUB_OUTPUT"

      # A branch pushed without a pull request is unreachable and, because the
      # branch name carries the run id, blocks a re-run of this very job.
      - name: Remove an orphaned branch from the tap
        if: failure() && steps.update.outputs.branch != '' && steps.update.outputs.pr == ''
        env:
          GH_TOKEN: ${{ steps.token-open.outputs.token }}
          BRANCH: ${{ steps.update.outputs.branch }}
        run: gh api -X DELETE "repos/${TAP_REPO}/git/refs/heads/${BRANCH}"

      - name: Require tap qualification
        if: steps.update.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.token-open.outputs.token }}
          PR: ${{ steps.update.outputs.pr }}
        run: |
          set -euo pipefail
          # `gh pr checks --watch` errors out when no check has been registered
          # yet, which races the tap workflow starting.
          for attempt in {1..18}; do
            gh pr checks "$PR" --repo "$TAP_REPO" >/dev/null 2>&1 && break
            if [[ "$attempt" == 18 ]]; then
              echo "::error::TAP004 the tap reported no checks for $PR"
              exit 1
            fi
            sleep 10
          done
          # Bounded well inside the token's hour, so a stalled tap lane fails
          # here with a clear message instead of on an expired credential.
          timeout 45m gh pr checks "$PR" --repo "$TAP_REPO" \
            --watch --fail-fast --interval 20

      # The wait above may have consumed most of the first token's life, so the
      # merge uses a fresh one. Minted unconditionally: with an `if:` here the
      # read-back below would need a fallback expression, and a credential whose
      # origin only a reader can resolve is not a demonstrated origin.
      - name: Mint a tap token for the merge
        id: token-merge
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ steps.tap.outputs.owner }}
          repositories: ${{ steps.tap.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Recheck the head and the guard, then merge
        if: steps.update.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.token-merge.outputs.token }}
          PR: ${{ steps.update.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.update.outputs.head }}
        run: |
          set -euo pipefail
          head=$(gh pr view "$PR" --repo "$TAP_REPO" --json headRefOid --jq .headRefOid)
          if [[ "$head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::TAP005 the pull request head moved from ${EXPECTED_HEAD} to ${head} during qualification"
            exit 1
          fi
          # The qualification proved the checks on this head. Merging is only
          # safe while the tap still enforces them. GitHub guards a branch either
          # through a ruleset or through classic branch protection, and the rules
          # endpoint reports only the first; the branch endpoint answers for both
          # and returns 200 whether or not the branch is guarded.
          branch=$(gh api "repos/${TAP_REPO}/branches/main")
          if [[ "$(printf '%s' "$branch" | jq -r '.protected')" != "true" ]]; then
            echo "::error::TAP006 main of ${TAP_REPO} is not protected; refusing to merge into an unguarded branch"
            exit 1
          fi
          gh pr merge "$PR" --repo "$TAP_REPO" --squash --delete-branch

      - name: Verify the formulas now on protected main
        if: steps.update.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.token-merge.outputs.token }}
        run: |
          set -euo pipefail
          for formula in snapdog snapdog-client; do
            published=$(gh api "repos/${TAP_REPO}/contents/Formula/${formula}.rb?ref=main" \
              --jq .content | base64 --decode)
            if ! printf '%s' "$published" | grep -Fq "releases/download/${TAG}/"; then
              echo "::error::TAP007 ${formula}.rb on main does not point at ${TAG}"
              exit 1
            fi
          done
          printf 'the tap now serves snapdog %s\n' "$VERSION"

  publish-aur:
    name: AUR (${{ matrix.pkg }})
    needs: [meta, publish-release, verify-release-assets]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pkg: snapdog
            pkgbuild: aur/snapdog/PKGBUILD
          - pkg: snapdog-client
            pkgbuild: aur/snapdog-client/PKGBUILD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: verified-release-assets
          path: artifacts
      - name: Update PKGBUILD version
        run: |
          set -euo pipefail
          VERSION=${{ needs.meta.outputs.version }}
          TAG=${{ needs.meta.outputs.tag }}
          X64_SHA=$(sha256sum "artifacts/snapdog-${TAG}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          ARM_SHA=$(sha256sum "artifacts/snapdog-${TAG}-aarch64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" ${{ matrix.pkgbuild }}
          sed -i "s/^pkgrel=.*/pkgrel=1/" ${{ matrix.pkgbuild }}
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${X64_SHA}')/" ${{ matrix.pkgbuild }}
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${ARM_SHA}')/" ${{ matrix.pkgbuild }}
          if [ "${{ matrix.pkg }}" = snapdog ]; then
            aux=$(sha256sum snapdog/systemd/snapdog.service snapdog/debian/snapdog.default snapdog.example.toml | awk '{printf "\047%s\047 ", $1}')
          else
            aux=$(sha256sum snapdog-client/systemd/snapdog-client.service snapdog-client/debian/snapdog-client.default | awk '{printf "\047%s\047 ", $1}')
          fi
          PKGBUILD="${{ matrix.pkgbuild }}" AUX="$aux" python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path(os.environ["PKGBUILD"])
          text = re.sub(r"sha256sums=\(.*?\)", f"sha256sums=({os.environ['AUX'].strip()})", path.read_text(), flags=re.S)
          path.write_text(text)
          PY
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: ${{ matrix.pkgbuild }}
          commit_username: metaneutrons
          commit_email: aur@metaneutrons.github.io
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.meta.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

  smoke-apt:
    name: Smoke-test the Debian packages
    needs: [meta, build-deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true

      # A throwaway key, generated here and gone with the runner. The archive
      # signs the published repository with the domain key; this job only has to
      # prove that the packages install through a signed repository at all, and
      # for that a key nobody keeps is enough. The archive signing key is
      # therefore no longer a secret of this repository.
      - name: Build and sign a throwaway repository
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --quick-generate-key --passphrase '' \
            'SnapDog release smoke test <noreply@snapdog.invalid>' rsa3072 sign never
          fpr=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "fpr" {print $10; exit}')

          repo="$RUNNER_TEMP/repo"
          install -d "$repo/pool" \
            "$repo/dists/stable/main/binary-amd64" "$repo/dists/stable/main/binary-arm64"
          find debs -name '*.deb' -exec cp {} "$repo/pool/" \;
          test "$(find "$repo/pool" -name '*.deb' | wc -l)" -eq 4 \
            || { echo "::error::expected four .deb files for two packages on two architectures"; exit 1; }

          cd "$repo"
          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "$arch" pool > "dists/stable/main/binary-${arch}/Packages"
            gzip -kf "dists/stable/main/binary-${arch}/Packages"
          done
          {
            echo "Origin: SnapDog"
            echo "Label: SnapDog"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Date: $(date -Ru)"
            echo "Architectures: amd64 arm64"
            echo "Components: main"
            echo "SHA256:"
            for f in main/binary-amd64/Packages main/binary-amd64/Packages.gz \
                     main/binary-arm64/Packages main/binary-arm64/Packages.gz; do
              echo " $(sha256sum "dists/stable/$f" | cut -d' ' -f1) $(stat -c%s "dists/stable/$f") $f"
            done
          } > dists/stable/Release
          gpg --batch --yes --local-user "$fpr" --digest-algo SHA256 \
            --clearsign --output dists/stable/InRelease dists/stable/Release
          gpg --batch --armor --export "$fpr" > snapdog-smoke-keyring.asc

      - name: Install both packages from that repository
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory "$RUNNER_TEMP/repo" >"$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          docker run --rm --add-host=host.docker.internal:host-gateway \
            debian:12-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 sh -euxc '
            printf "#!/bin/sh\nexit 101\n" >/usr/sbin/policy-rc.d
            apt-get update && apt-get install -y ca-certificates curl gpg
            curl -fsSL http://host.docker.internal:8000/snapdog-smoke-keyring.asc \
              -o /usr/share/keyrings/snapdog-smoke-keyring.asc
            echo "deb [signed-by=/usr/share/keyrings/snapdog-smoke-keyring.asc] http://host.docker.internal:8000 stable main" \
              >/etc/apt/sources.list.d/snapdog.list
            apt-get -o Acquire::AllowInsecureRepositories=false update
            apt-get install -y snapdog snapdog-client
            snapdog --version
            snapdog-client --version
          '

  archive-dispatch:
    name: Hand the release to the APT archive
    needs: [meta, publish-release, smoke-apt]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      ARCHIVE_REPO: metaneutrons/apt-archive
      # Two different names for the same archive, and the dispatch takes the
      # first: `domain` is a choice input listing the manifest directories under
      # domains/, while the host only appears inside that manifest and in the
      # public URL. Passing the host is rejected with HTTP 422 before any run
      # starts.
      ARCHIVE_DOMAIN: snapdog.cc
      ARCHIVE_HOST: deb.snapdog.cc
      ARCHIVE_PROJECT: snapdog
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Mint a token for the archive alone
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ARCHIVE_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.ARCHIVE_DISPATCH_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: apt-archive
          permission-actions: write
          permission-contents: read

      - name: Verify the token reaches the archive and nothing else
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          mapfile -t reach < <(gh api /installation/repositories \
            --jq '.repositories[].full_name' | sort)
          printf 'the token reaches: %s\n' "${reach[*]:-nothing}"
          if [[ ${#reach[@]} -ne 1 || "${reach[0]}" != "$ARCHIVE_REPO" ]]; then
            echo "::error::APT9001 the dispatch token reaches ${#reach[@]} repositories, expected only ${ARCHIVE_REPO}"
            exit 1
          fi

      - name: Knock, and observe the run it starts
        id: knock
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          branch=$(gh api "repos/${ARCHIVE_REPO}" --jq .default_branch)
          before=$(gh run list --repo "$ARCHIVE_REPO" --workflow=publish.yml \
            --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run publish.yml --repo "$ARCHIVE_REPO" --ref "$branch" \
            -f domain="$ARCHIVE_DOMAIN" -f project="$ARCHIVE_PROJECT"
          # Never correlate by simply taking the newest run: another domain may
          # publish at the same moment. Wait for an id that did not exist before
          # the knock and hold on to exactly that one.
          run_id=0
          for _ in {1..24}; do
            sleep 5
            candidate=$(gh run list --repo "$ARCHIVE_REPO" --workflow=publish.yml \
              --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [[ "$candidate" != "$before" ]]; then run_id="$candidate"; break; fi
          done
          if [[ "$run_id" == 0 ]]; then
            echo "::error::APT9002 the dispatch produced no run within 120s"
            exit 1
          fi
          printf 'archive run %s\n' "$run_id"
          gh run watch "$run_id" --repo "$ARCHIVE_REPO" --exit-status --interval 20

      # A green archive run is not proof that the archive serves this version.
      # Take the route a client with Acquire-By-Hash takes: InRelease is the
      # commit point and is served uncached, the Packages index behind it is
      # content addressed and therefore cannot go stale. Polling
      # binary-<arch>/Packages.gz instead reads a mutable path that a CDN caches.
      - name: Verify what the archive serves, along the client's path
        run: |
          set -euo pipefail
          base="https://${ARCHIVE_HOST}"
          curl --fail --silent --show-error --location \
            "${base}/dists/rolling/InRelease" -o "$RUNNER_TEMP/InRelease"
          for arch in amd64 arm64; do
            want="main/binary-${arch}/Packages.gz"
            digest=$(ARCH_PATH="$want" python3 - "$RUNNER_TEMP/InRelease" <<'PY'
          import re, sys, os
          want = os.environ["ARCH_PATH"]
          # The block ends at the first unindented line. A terminator of
          # ^[A-Za-z-]+: misses SHA512: and SHA256:, because the class has no
          # digits, and every later section is then read as part of this one.
          field = re.compile(r"^[A-Za-z][A-Za-z0-9-]*:")
          inside = False
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              if field.match(line):
                  inside = line.startswith("SHA512:")
                  continue
              if not inside or not line.startswith(" "):
                  continue
              parts = line.split()
              if len(parts) == 3 and parts[2] == want:
                  print(parts[0])
                  break
          PY
          )
            if [[ -z "$digest" ]]; then
              echo "::error::APT9003 InRelease carries no SHA512 entry for ${want}"
              exit 1
            fi
            # apt asks for SHA512 first. Asking for it too turns a silent
            # fallback to a weaker digest into a failed release job. Two by-hash
            # directories exist and they are not interchangeable: dists/<suite>/by-hash
            # carries the archive state, the package indices live under the
            # component and architecture.
            curl --fail --silent --show-error --location \
              "${base}/dists/rolling/main/binary-${arch}/by-hash/SHA512/${digest}" \
              -o "$RUNNER_TEMP/Packages.gz"
            measured=$(sha512sum "$RUNNER_TEMP/Packages.gz" | cut -d' ' -f1)
            if [[ "$measured" != "$digest" ]]; then
              echo "::error::APT9004 by-hash object for ${want} does not match its own name"
              exit 1
            fi
            # Content addressing says what the object should be, not what the
            # archive put there, hence the comparison above before this one.
            # Both packages of this release have to be in the index; checking one
            # would pass while the other silently never arrived.
            for package in snapdog snapdog-client; do
              if ! gzip -dc "$RUNNER_TEMP/Packages.gz" | awk -v p="$package" -v v="${VERSION}-1" '
                   /^Package: /{pkg=$2; ver=""} /^Version: /{ver=$2}
                   pkg==p && ver==v {found=1} END{exit !found}'; then
                echo "::error::APT9005 the ${arch} index does not carry ${package} ${VERSION}-1"
                exit 1
              fi
              printf 'the %s index carries %s %s-1\n' "$arch" "$package" "$VERSION"
            done
          done

  docker:
    name: Docker ${{ matrix.image }}
    # Reuse the Linux binaries compiled once by the `build` job instead of recompiling
    # snapdog inside Docker per arch. The binary is only COPYd (never recompiled), so a
    # single multi-arch buildx build is cheap; only the small runtime layer (apt + user
    # setup) runs under arm64 emulation — hence setup-qemu-action below. The container then
    # ships the exact same binary as the tarball.
    needs: [meta, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: snapdog
            file: Dockerfile
            repo: ghcr.io/snapdogrocks/snapdog
          - image: snapdog-client
            file: Dockerfile.client
            repo: ghcr.io/snapdogrocks/snapdog-client
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The prebuilt binary is only COPYd, but the runtime stage still RUNs apt-get +
      # groupadd/useradd, which execute as the target arch — so building the arm64 layer on
      # this amd64 runner needs a binfmt/QEMU handler registered. amd64 is native.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch pre-built Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: snapdog-*-unknown-linux-gnu
          path: dl
      - name: Stage binaries for the prebuilt Docker stage
        shell: bash
        run: |
          set -euo pipefail
          declare -A arch=( [x86_64-unknown-linux-gnu]=amd64 [aarch64-unknown-linux-gnu]=arm64 )
          for triple in "${!arch[@]}"; do
            tb=$(find dl -type f -name "snapdog-*-${triple}.tar.gz" | head -1)
            test -n "$tb" || { echo "::error::missing ${triple} tarball in build artifacts"; find dl -type f; exit 1; }
            mkdir -p "extract/${triple}"
            tar xzf "$tb" -C "extract/${triple}"
            bin=$(find "extract/${triple}" -type f -name "${{ matrix.image }}" | head -1)
            test -n "$bin" || { echo "::error::${{ matrix.image }} not in ${triple} tarball"; find "extract/${triple}" -type f; exit 1; }
            install -Dm0755 "$bin" "bins/${arch[$triple]}/${{ matrix.image }}"
          done
          ls -R bins
      - name: Compute image tags
        id: tags
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          tags="${REPO}:${TAG}"
          # Only a final release (no pre-release identifier) moves the :latest tag.
          if [[ "${TAG}" != *-* ]]; then
            tags="${tags}"$'\n'"${REPO}:latest"
          fi
          { echo 'list<<EOF'; printf '%s\n' "$tags"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Build and push multi-arch image (prebuilt binary — no recompile)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            BIN_STAGE=prebuilt
            BUILD_VERSION=${{ needs.meta.outputs.version }}
            BUILD_REVISION=${{ needs.meta.outputs.revision }}
            BUILD_CREATED=${{ needs.meta.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Smoke-test the published image (both arches)
        env:
          REF: ${{ matrix.repo }}:${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Pull-and-run each published variant to prove the prebuilt binary is placed
          # correctly and is glibc-compatible with the runtime. amd64 runs natively; arm64
          # runs via the QEMU binfmt handler registered above. The release (prebuilt) path is
          # NOT covered by the PR container-images job, which builds BIN_STAGE=compile.
          for platform in linux/amd64 linux/arm64; do
            echo "::group::smoke ${platform}"
            docker run --rm --platform "${platform}" "${REF}" --version
            echo "::endgroup::"
          done
      - name: Sign the published image by digest
        env:
          REPO: ${{ matrix.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-push-action returned no valid image digest: '${DIGEST}'"
            exit 1
          fi
          cosign sign --yes "${REPO}@${DIGEST}"

  updater-image:
    name: Docker snapdog-updater
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Compute updater tags
        id: tags
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          tags="ghcr.io/snapdogrocks/snapdog-updater:${TAG}"
          if [[ "${TAG}" != *-* ]]; then tags="${tags}"$'\n'"ghcr.io/snapdogrocks/snapdog-updater:latest"; fi
          { echo 'list<<EOF'; printf '%s\n' "$tags"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - name: Build and push updater image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/updater
          file: deploy/updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: UPDATER_VERSION=${{ needs.meta.outputs.tag }}
          provenance: mode=max
          sbom: true
      - name: Sign updater image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "ghcr.io/snapdogrocks/snapdog-updater@${DIGEST}"

  bump-snapdog-os:
    name: Bump version in snapdog-os
    needs: [meta, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: SnapDogRocks/snapdog-os
          token: ${{ secrets.SNAPDOG_OS_PAT }}
          ref: main
      - name: Update version in buildroot packages
        run: |
          VERSION=${{ needs.meta.outputs.version }}
          sed -i "s/^SNAPDOG_SERVER_VERSION = .*/SNAPDOG_SERVER_VERSION = ${VERSION}/" \
            buildroot/package/snapdog-server/snapdog-server.mk
          sed -i "s/^SNAPDOG_CLIENT_VERSION = .*/SNAPDOG_CLIENT_VERSION = ${VERSION}/" \
            buildroot/package/snapdog-client/snapdog-client.mk
          
          # Fetch the checksum of the new release tarball and update the hash file
          URL="https://github.com/SnapDogRocks/snapdog/releases/download/v${VERSION}/SHA256SUMS"
          FILE="snapdog-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          # Exact filename match: a plain grep for "…tar.gz" ALSO matches the
          # "…tar.gz.sha256" line, so `awk '{print $1}'` captured two hashes and
          # wrote a malformed two-line .hash (Buildroot then errors "No hash found").
          # Strip sha256sum's optional leading "./", then select only the tarball.
          HASH=$(curl -fsSL "$URL" | awk -v f="$FILE" '{ name = $2; sub(/^\.\//, "", name); if (name == f) print $1 }')
          if ! printf '%s' "$HASH" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::Expected one sha256 for ${FILE} from ${URL}, got: '${HASH}'"
            exit 1
          fi
          printf '# Remote SnapDog release artifact.\nsha256  %s  %s\n' "$HASH" "$FILE" \
            > buildroot/package/snapdog-client/snapdog-client.hash
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.0.0
        with:
          token: ${{ secrets.SNAPDOG_OS_PAT }}
          # `fix(deps)` (NOT `chore(deps)`): release-please only cuts a release for
          # fix/feat commits, so this type is what makes merging the PR open a
          # snapdog-os release-please PR — i.e. every snapdog release ships in the OS.
          commit-message: "fix(deps): bump snapdog to ${{ needs.meta.outputs.version }}"
          title: "fix(deps): bump snapdog to ${{ needs.meta.outputs.version }}"
          body: |
            Automated version bump from [snapdog ${{ needs.meta.outputs.tag }}](https://github.com/SnapDogRocks/snapdog/releases/tag/${{ needs.meta.outputs.tag }}).

            This is a **rolling** PR: a later snapdog release re-pushes this same
            branch and updates it in place (new version, hash, title) instead of
            opening another one. Merging it lands a `fix(deps)` on `main`, which
            makes release-please open a snapdog-os release PR so the new snapdog
            ships in the next OS image.
          # Stable branch name (NOT `deps/snapdog-<version>`): peter-evans reuses an
          # open PR on this branch and force-updates it each release, so successive
          # releases roll one PR forward instead of stacking a new deps PR every time.
          # On merge the branch is deleted and the next release recreates it fresh.
          branch: deps/snapdog
          delete-branch: true
