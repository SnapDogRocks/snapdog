name: Nightly

# Comprehensive, non-blocking suite kept off the per-PR critical path: line
# coverage, the full feature-combo build matrix, and a time-based advisory sweep
# (new RUSTSEC advisories appear without any code change). Runs nightly, on every
# push to main (post-merge validation), and on demand.
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN across all jobs (all read-only).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install Rust toolchain
        # Version, components and profile come from rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libavahi-compat-libdnssd-dev
      - name: Skip WebUI build (placeholder is generated by snapdog/build.rs)
        shell: bash
        run: echo "SKIP_WEBUI_BUILD=1" >> "$GITHUB_ENV"
      - name: Coverage (tier-1, gate on threshold)
        # Default features (snapcast-embedded). Threshold is a regression guard set
        # a few points below the current ~50% line coverage (IT-T92).
        run: cargo llvm-cov --locked -p snapdog --lcov --output-path lcov.info --fail-under-lines 45
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  build-smoke-full:
    name: Build Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Full feature-combo firewall kept off the pull-request critical path.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "embedded (default)", features: "snapcast-embedded,spotify,dbus" }
          - { name: "embedded minimal", features: "snapcast-embedded" }
          - { name: "embedded full", features: "full" }
          - { name: "process minimal", features: "snapcast-process" }
          - { name: "process full", features: "snapcast-process,ap2,spotify,dbus,api-docs" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install Rust toolchain
        # Version, components and profile come from rust-toolchain.toml.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libavahi-compat-libdnssd-dev
      - name: Skip WebUI build (placeholder is generated by snapdog/build.rs)
        shell: bash
        run: echo "SKIP_WEBUI_BUILD=1" >> "$GITHUB_ENV"
      - name: cargo check
        run: cargo check --locked -p snapdog --no-default-features --features "${{ matrix.features }}"

  integration:
    name: Integration Tests
    uses: ./.github/workflows/tier2-integration.yml
    with:
      report-name: nightly-nextest-report

  container-images:
    name: Container (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: snapdog
            file: Dockerfile
          - image: snapdog-client
            file: Dockerfile.client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: local/${{ matrix.image }}:nightly
          build-args: CARGO_RELEASE_LTO=false
          cache-from: type=gha,scope=nightly-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=nightly-${{ matrix.image }}
          provenance: false
      - name: Verify runtime contract
        env:
          IMAGE: local/${{ matrix.image }}:nightly
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")" = "10001:10001"
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges "${IMAGE}" --version
      - name: Scan runtime image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:nightly
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  audit-sweep:
    name: Security Audit (advisory sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install Rust toolchain
        # Version, components and profile come from rust-toolchain.toml.
        run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.22.0
      - name: Run cargo-deny (advisories, licences, bans, sources)
        # Same deny.toml as ci.yml's dep-triggered check. This scheduled run
        # catches newly-published advisories against the unchanged Cargo.lock,
        # and with `--deny advisory-not-detected` also the reverse case: an
        # exception whose advisory no longer matches any crate, which upstream
        # can cause without any commit here.
        run: cargo deny check --deny advisory-not-detected
