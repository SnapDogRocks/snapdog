<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The SnapDog server publishes one MPRIS2 player per zone on the system bus
     (org.mpris.MediaPlayer2.snapdog.zoneN, or .instanceM.zoneN for a second
     server). It runs as a systemd DynamicUser, so there is no fixed user to
     grant this to: any local process may own these names and call them. -->
<busconfig>
  <policy context="default">
    <allow own_prefix="org.mpris.MediaPlayer2.snapdog"/>
    <allow send_destination_prefix="org.mpris.MediaPlayer2.snapdog"/>
  </policy>
</busconfig>
