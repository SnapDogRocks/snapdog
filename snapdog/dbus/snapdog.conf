<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The SnapDog server publishes one MPRIS2 player per zone on the system bus
     (org.mpris.MediaPlayer2.snapdog.zoneN, or .instanceM.zoneN for a second
     server). It runs as a systemd DynamicUser, so there is no fixed user to
     grant this to: any local process may own these names (own_prefix covers
     all of them) and call them.

     Sending is allowed name by name: zones 1 to 16, each with the plain name
     and .instance2 to .instance10, which are the names the server tries in
     turn. A prefix rule would be shorter, but send_destination_prefix is not
     portable. dbus-broker does not know it and denies every caller, and
     dbus-daemon 1.12 (Ubuntu 22.04) rejects the whole file. send_destination
     works on all of them. A zone above 16 still gets its name, but nobody
     can call it on the system bus until it is added here; the server logs a
     warning for such a zone.

     If the server changes the names it requests, the test
     policy_file_is_exactly_what_bus_names_requires in src/dbus/mod.rs lists
     the lines to change here. It compares the whole file, so any other rule
     added here fails it too.

     Known limit: own_prefix lets every local user own these names, not only
     the service. The service is a DynamicUser, so its uid is not known when
     the daemon reads this file and no rule can single it out. A local user
     who owns a name before the service asks for it (at boot, or in the
     moment after a restart) makes the service fall back to the next
     .instanceN name, and a call to the plain name then reaches that user.
     That user can misdirect or swallow media key commands and show wrong
     metadata. They receive only MPRIS calls, which carry no secrets, and the
     policy already lets every local user control the players. A host that
     cannot accept this gives the service a fixed User= instead of
     DynamicUser, and replaces the own_prefix rule here with one inside a
     policy element for that user. -->
