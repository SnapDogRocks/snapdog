# SnapDog configuration installed by the Debian and Arch packages.
#
# This is a minimal starting point: one zone, AirPlay and Spotify Connect with
# their defaults, and the web UI on port 5555. Edit it, then apply with
#   sudo systemctl restart snapdog
#
# Every option, with examples for clients, radio stations, Subsonic, MQTT and
# KNX, is in snapdog.example.toml and at https://snapdog.cc/docs/configuration
# (the release archive ships the example file as well).

name = "SnapDog"

[http]
# Set this to the address other devices use to reach the web UI. It is used for
# absolute URLs such as cover art.
# base_url = "http://192.168.1.10:5555"

[snapcast]
# Players that connect without a [[client]] entry are placed in this zone.
default_zone = "Living Room"

[spotify]

[[zone]]
name = "Living Room"
