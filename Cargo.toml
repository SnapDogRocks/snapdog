[workspace]
resolver = "2"
members = [
  "snapdog",
  "snapdog-client",
  "snapdog-common",
  "snapdog-testkit",
  "xtask",
]

[workspace.package]
version = "0.27.6"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/SnapDogRocks/snapdog"
authors = ["Fabian Schmieder"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# mDNS discovery
mdns-sd = "0.21"

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-full"] }
utoipa = { version = "5", features = ["uuid", "chrono"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Audio decoding
symphonia = { version = "0.6", features = ["aac", "mp3", "flac", "alac", "isomp4", "pcm"] }

# Audio resampling
rubato = "5.0"
biquad = "0.6"

# MQTT
# rumqttc 0.25's default Rustls feature pins vulnerable rustls-webpki 0.102.x
# (GHSA advisory #21). Native TLS is supported upstream and avoids that path.
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }

# KNX
knx-rs-core = { version = "0.9.1", package = "knx-rs-core" }
knx-rs-ip = { version = "0.9.1", package = "knx-rs-ip" }
knx-rs-device = { version = "0.9.1", package = "knx-rs-device" }

# HTTP client (Subsonic API, radio streams)
reqwest = { version = "0.13", features = ["json", "stream"] }

# TLS crypto provider — install a process-level default. Both `ring` and `aws-lc-rs`
# are present transitively (axum-server/bollard vs reqwest), so rustls cannot auto-pick
# one; see `api::install_crypto_provider`.
rustls = "0.23"

# URL parsing
url = "2"

# Stream utilities
futures-util = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Snapcast
snapcast-server = { version = "0.17.2", features = ["flac", "encryption", "custom-protocol"] }
snapcast-client = "0.17.2"
snapcast-proto = "0.17.2"

# Shared
snapdog-common = { path = "snapdog-common" }

# Utilities
md5 = "0.8"
fastrand = "2"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Testing
[workspace.dependencies.mockall]
version = "0.15"

[workspace.dependencies.tempfile]
version = "3"

[workspace.dependencies.wiremock]
version = "0.6"

[workspace.dependencies.dotenvy]
version = "0.15"

[profile.release]
# Thin LTO + parallel codegen: ~full-LTO runtime performance at a fraction of the build
# time. Fat LTO (`lto = true`) with `codegen-units = 1` made release builds 2–4 h each
# (the Windows leg alone ~4 h) because whole-program LTO is single-threaded and cu=1
# disables codegen parallelism. Thin LTO parallelizes across units — cuts the matrix to
# ~30–60 min with a negligible (~2–5 %) runtime cost.
lto = "thin"
strip = true
codegen-units = 16

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Pedantic — strict but reasonable
pedantic = { level = "warn", priority = -1 }
# Nursery — useful experimental lints
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Centralized pedantic/nursery exceptions, formerly duplicated as
# `#![allow(clippy::...)]` blocks in snapdog/src/lib.rs, snapdog/src/main.rs,
# snapdog-common/src/lib.rs, snapdog-client/src/main.rs and xtask/src/main.rs.
# Every member crate inherits these via `[lints] workspace = true`.

# `cargo_common_metadata` (part of the `cargo` group above) expects readme,
# keywords, categories and repository metadata a crates.io listing would show.
# None of this workspace's crates are published (confirmed: crates.io returns
# 404 for snapdog, snapdog-client, snapdog-common and snapdog-testkit), so that
# metadata would exist only to silence the lint.
cargo_common_metadata = "allow"
# `multiple_crate_versions` (also part of `cargo`) flags any duplicate transitive
# version anywhere in the resolved graph. With audio codec, KNX, MQTT and TLS
# stacks all pulling their own dependency trees, duplicates (e.g. two `syn`
# versions) are structurally unavoidable without vendoring or waiting on every
# upstream crate to synchronize. `cargo-deny`'s `[bans] multiple-versions =
# "warn"` (deny.toml) is the appropriate, non-fatal check for this already.
multiple_crate_versions = "allow"

# Audio, protocol and KNX-XML-generation code performs intentional numeric
# narrowing (sample counts, buffer/memory sizes, protocol field widths); the
# values are bounds-checked structurally, not by the lint.
cast_possible_truncation = "allow"
# The same casts also lose sign, e.g. a validated non-negative i32 volume or
# duration converted to u32/u16.
cast_sign_loss = "allow"
# Casts to floating point are intentional in audio gain/volume math and timing
# calculations.
cast_precision_loss = "allow"
# Float comparisons are acceptable for gain/volume values, which are read back
# exactly as set rather than accumulated through arithmetic.
float_cmp = "allow"
# Expected with `tokio::spawn`: futures capturing non-`Send` handles are scoped
# to a single task and never crossed between threads.
future_not_send = "allow"
# Reflects protocol/session state (KNX, Snapcast, playback) where each flag is
# an independent wire-level toggle, not a type-design smell.
struct_excessive_bools = "allow"
# Fixed at public API boundaries; internal helpers taking a `HashMap`
# parameter are not part of any external contract.
implicit_hasher = "allow"
# Protocol/event-loop `match` arms and ETS-XML generation intentionally share
# setup code where splitting it out would obscure the control flow; long
# functions are unavoidable in protocol handlers and XML generation.
branches_sharing_code = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
