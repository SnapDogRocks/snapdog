[package]
name = "snapdog-client"
description = "SnapDog multiroom audio client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "snapdog-client"
path = "src/main.rs"


[target.'cfg(target_os = "linux")'.dependencies]
# CPAL 0.18.2 still links alsa-sys 0.4 through alsa 0.11. ALSA 0.12
# links a different alsa-sys version; Cargo forbids both in the same graph.
alsa = "0.11"
sd-notify = "0.5"
[dependencies]
snapcast-client = { workspace = true }
snapcast-proto = { workspace = true }
snapdog-common = { workspace = true }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.23"
libc = "0.2"
cpal = "0.18"
biquad = { workspace = true }
serde_json = "1"
midir = "0.11.0"
mdns-sd = { workspace = true, optional = true }
zbus = { version = "5", optional = true }

[features]
default = ["mdns", "f32lz4", "encryption", "custom-protocol", "dbus"]
mdns = ["dep:mdns-sd"]
dbus = ["dep:zbus"]
f32lz4 = ["snapcast-client/f32lz4"]
websocket = ["snapcast-client/websocket"]
tls = ["snapcast-client/tls"]
resampler = ["snapcast-client/resampler"]
custom-protocol = ["snapcast-client/custom-protocol"]
encryption = ["snapcast-client/encryption"]

[package.metadata.deb]
section = "sound"
copyright = "2026 Fabian Schmieder"
depends = "libasound2, libavahi-compat-libdnssd1"
assets = [
  ["target/release/snapdog-client", "usr/bin/", "755"],
  ["debian/snapdog-client.default", "etc/default/snapdog-client", "644"],
]
systemd-units = { unit-name = "snapdog-client", enable = true, start = true }

# This crate's `daemonize()` uses genuine `unsafe` (libc setpriority/fork/setsid),
# so it cannot inherit the workspace's `unsafe_code = "forbid"` as-is. Cargo's lint
# inheritance is all-or-nothing per manifest — `[lints] workspace = true` cannot be
# combined with any local override, including a per-tool-table one (verified
# against cargo 1.97.0: both forms error at manifest-parse time) — so the `clippy`
# group below is a deliberate, kept-in-sync copy of [workspace.lints.clippy] rather
# than an inheritance, solely so `[lints.rust] unsafe_code` can be lowered to `deny`
# for this one crate as rust.md prescribes: still hard-errors on any *other*,
# undocumented unsafe usage, just not un-overridable like `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
float_cmp = "allow"
future_not_send = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"
branches_sharing_code = "allow"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
