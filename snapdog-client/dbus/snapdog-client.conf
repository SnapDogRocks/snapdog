<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- snapdog-client publishes MPRIS2 on the system bus so the desktop, the
     SnapDog OS web UI and other tools can show and control playback.
     The service runs as a systemd DynamicUser, so there is no fixed user to
     grant this to: any local process may own the name (own_prefix also
     covers the .instanceN names a second client takes) and call it.

     Sending is allowed name by name: the plain name and .instance2 to
     .instance10, which are the names the client tries in turn. A prefix rule
     would be shorter, but send_destination_prefix is not portable. dbus-broker
     does not know it and denies every caller, and dbus-daemon 1.12 (Ubuntu
     22.04) rejects the whole file. send_destination works on all of them.

     If the client changes the names it requests, the test
     policy_file_lists_every_bus_name in src/dbus.rs lists the lines to change
     here. -->
<busconfig>
  <policy context="default">
    <allow own_prefix="org.mpris.MediaPlayer2.snapdog_client"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client.instance2"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client.instance3"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client.instance4"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client.instance5"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client.instance6"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client.instance7"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client.instance8"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client.instance9"/>
    <allow send_destination="org.mpris.MediaPlayer2.snapdog_client.instance10"/>
  </policy>
</busconfig>
