# ══════════════════════════════════════════════════════════════════════════════
# SnapDog Configuration
# ══════════════════════════════════════════════════════════════════════════════
# Copy to snapdog.toml and adjust to your setup.
# All sections and fields are optional — sensible defaults are used.

# Server display name — used for mDNS discovery, MQTT, KNX device name.
# name = "SnapDog"

# ── System ─────────────────────────────────────────────────────────────────
[system]
# Logging verbosity: trace, debug, info, warn, error
log_level = "info"
# Optional: log to file with daily rotation (in addition to stdout)
# log_file = "/var/log/snapdog/snapdog.log"
# Directory for persistent state files (zones.json, eq.json, snapcast.json).
# Default: platform-appropriate (Linux: ~/.local/state/snapdog, macOS: ~/Library/Application Support/snapdog)
# state_dir = "/var/lib/snapdog"

# ── Audio ──────────────────────────────────────────────────────────────────
[audio]
# Output sample rate in Hz. All sources are resampled to this rate.
sample_rate = 48000
# Output bit depth: 16, 24, or 32
bit_depth = 16
# Number of channels (2 = stereo)
channels = 2
# How to resolve conflicts when AirPlay/Spotify is active and local
# playback (radio/subsonic) is requested:
#   "last_wins" = most recent source takes over (default)
#   "receiver_wins" = AirPlay/Spotify blocks until it stops
source_conflict = "last_wins"
# Fade duration (ms) when a SnapDog client switches zones.
# The client fades out, switches, then fades in. Set to 0 to disable.
zone_switch_fade_ms = 300
# Fade duration (ms) when switching audio sources within a zone
# (e.g., radio → subsonic). Server-side fade-out then fade-in. 0 to disable.
source_switch_fade_ms = 300

# ── HTTP Server ────────────────────────────────────────────────────────────
[http]
# WebUI + REST API port
port = 5555
# External base URL for absolute links in API responses.
# Required if behind a reverse proxy or accessed from other hosts.
base_url = "http://192.168.1.10:5555"
# Optional: restrict API access with bearer tokens.
# If empty, all endpoints are open. WebUI and /health are always accessible.
# api_keys = ["my-secret-token"]
# Optional: TLS — enables HTTPS for REST API and WebUI.
# Both tls_cert and tls_key must be set together.
# tls_cert = "/etc/snapdog/tls/fullchain.pem"
# tls_key = "/etc/snapdog/tls/privkey.pem"
# Enable embedded Scalar API documentation (only if feature api-docs is compiled in).
# api_docs = true

# ── Snapcast ───────────────────────────────────────────────────────────────
[snapcast]
# Snapcast server address (loopback for embedded server)
address = "127.0.0.1"
# JSON-RPC control port
# jsonrpc_tcp_port = 1705
# Audio streaming port (clients connect here)
streaming_port = 1704
# Streaming codec: "pcm", "flac", "f32lz4", "f32lz4e" (encrypted)
codec = "flac"
# Pre-shared key for f32lz4e encryption (both server and client must match)
# encryption_psk = "my-secret-key"
# How zone volume changes affect individual client volumes:
#   "absolute" = set all clients to the zone volume
#   "relative" = scale proportionally: client_volume * zone_volume / 100
#   "compressed" = compressed scaling with headroom preservation (default)
group_volume_mode = "relative"
# Whether SnapDog manages (starts/stops) the snapserver process.
# Set to false if using an external snapserver.
managed = true
# Snapserver verbose logging (for debugging)
# verbose = false
# Policy for unknown Snapcast clients (not in [[client]] config):
#   "accept" = assign to default_zone
#   "ignore" = allow connection but don't manage
#   "reject" = disconnect immediately
unknown_clients = "accept"
# Zone to assign unknown clients to (only used with "accept" policy)
default_zone = "Ground Floor"

# ── mDNS / Bonjour ────────────────────────────────────────────────────────
[mdns]
# Enable mDNS service advertisement (default: true)
# enabled = true
# Additionally advertise _snapcast._tcp for standard Snapcast client discovery
# advertise_snapcast = false

# ── D-Bus / MPRIS2 ────────────────────────────────────────────────────────
[dbus]
# Enable MPRIS2 D-Bus interface per zone (Linux only, default: true)
# enabled = true

# ── AirPlay ────────────────────────────────────────────────────────────────
[airplay]
# Protocol mode: "airplay2" (default) or "airplay1" for legacy compatibility
# mode = "airplay2"
# Optional: require password for AirPlay connections
# password = "1234"
# Optional: bind to specific network interfaces
# bind = ["192.168.1.10"]

# ── Spotify Connect ────────────────────────────────────────────────────────
# Remove this section entirely to disable Spotify Connect.
[spotify]
# Spotify Connect device name (visible in Spotify app)
name = "SnapDog"
# Spotify streaming bitrate: 96, 160, or 320 kbps
bitrate = 320

# ── Subsonic / Navidrome ───────────────────────────────────────────────────
# Remove this section entirely to disable Subsonic integration.
[subsonic]
url = "http://navidrome:4533"
username = "admin"
password = "admin"
# Transcoding format: "raw" (original), "flac", "mp3", "opus"
# format = "raw"
# Skip TLS certificate verification (for self-signed certs)
# tls_skip_verify = false

# Track cache — always active for instant seek and replay.
# [subsonic.cache]
# path = "~/.cache/snapdog/tracks"  # Cache directory (default: platform-appropriate)
# max_size_mb = 2048                # Max cache size (LRU eviction)

# ── MQTT ───────────────────────────────────────────────────────────────────
# Remove this section entirely to disable MQTT.
#
# What SnapDog does over MQTT (all topics below `base_topic`):
#   publishes   status                      "online" / "offline" (retained, last will)
#               zones/<n>/state             JSON, retained
#               clients/<n>/state           JSON, retained
#   subscribes  zones/<n>/<what>/set        volume, mute, control, shuffle, repeat, position,
#               clients/<n>/<what>/set      track, playlist, presence, ... (a `set` topic is a
#                                           command; a retained command is never executed)
# <n> is the position of the [[zone]] / [[client]] in this file, counting from 1. A client that
# Snapcast accepts at runtime (snapcast.unknown_clients = "accept") gets the next free number
# after those in the file.
[mqtt]
# Broker address:
#   "host:1883"            plaintext; also "mqtt://host" or "tcp://host" (port 1883 if omitted)
#   "mqtts://host:8883"    TLS; also "ssl://host" or "tls://host" (port 8883 if omitted)
# TLS verifies the broker's certificate and its host name, always; there is no way to
# switch that off. Without `ca_file` it is checked against the system trust store.
# Minimum TLS 1.2. Do not put user:password into the address: use the keys below.
# The host must be ASCII: write an international name in punycode (xn--mller-kva.lan).
broker = "192.168.1.10:1883"
# client_id = "snapdog"            # MQTT client ID. Must be unique per broker: a second client
#                                  # with the same ID makes the broker drop the first, and the two
#                                  # then take turns (the log says so after a few rounds).

# A wrong [mqtt] section switches MQTT off (and logs why); the server keeps running.
# `snapdog --check-config` reports it as an error. Unknown keys count as wrong.
#
# Credentials. A password needs a username. In order of preference:
#   - password_file: a file holding the password alone, one line (Docker/Kubernetes
#     secrets, systemd credentials). A file others can read gives a warning: chmod 600.
#   - the SNAPDOG_MQTT_PASSWORD environment variable (wins over password_file and password;
#     an empty variable counts as unset)
#   - password: in this file
# username = "snapdog"             # or SNAPDOG_MQTT_USERNAME
# password_file = "/run/secrets/snapdog_mqtt_password"
# password = "snapdog"
# SnapDog warns at start-up if credentials would go over plaintext to another machine.

# TLS material, only with an mqtts:// address (PEM files):
# ca_file = "/etc/snapdog/mqtt-ca.pem"          # CA that signed the broker's certificate. Replaces
#                                               # the system trust store (for a private CA);
#                                               # or SNAPDOG_MQTT_CA_FILE
# client_cert = "/etc/snapdog/mqtt-client.pem"  # mutual TLS: certificate (+ chain) ...
# client_key = "/etc/snapdog/mqtt-client.key"   # ... and its key, unencrypted PKCS#8
#                                               # ("BEGIN PRIVATE KEY"). Convert with
#                                               # `openssl pkey -in old.key -out client.key`.
#                                               # macOS imports RSA keys only (Secure Transport).
#                                               # Or SNAPDOG_MQTT_CLIENT_CERT / _CLIENT_KEY.
# In KNX device mode ETS sets broker and base topic (an ETS broker field of up to 40 bytes
# holds e.g. "mqtts://mqtt.example.org:8883"); username and TLS files come from the
# SNAPDOG_MQTT_* variables above. The ETS password has no use without a username.

# Base topic prefix. All topics are published/subscribed under this prefix.
base_topic = "snapdog"

# Earlier releases left retained messages behind: `snapdog//status` (inside the base topic)
# and `homeassistant/media_player/snapdog_zone_<n>/config` (outside it; Home Assistant never
# did anything with them). Not set: SnapDog deletes only `snapdog//status` at every start, so
# that an ACL confining it to the base topic is not asked for anything else. true: also the
# media_player topics (set it for one start). false: nothing.
# clear_legacy_topics = true

# Home Assistant MQTT discovery. Off unless you set it. SnapDog then sends ONE retained device
# message (homeassistant/device/snapdog_<server id>/config) that lists, per zone and client,
# the entities MQTT can express: volume, mute, shuffle, repeat, transport buttons, what plays,
# presence; per client volume, mute, latency, zone, connected. (Home Assistant's MQTT
# integration has no media_player, so a zone cannot be announced as one.) It is sent after every
# connect, when a client is added, and again after Home Assistant's birth message.
# The values of `discovery`:
#   true       announce
#   false      announce nothing and DELETE the device message of an earlier run
#              (how to take the entities out of Home Assistant again)
#   not set    off; nothing is written to the discovery topic
# Entity ids follow the position of the [[zone]] / [[client]] in this file: moving one moves
# its entities onto another zone. No cover art is announced (Home Assistant's image entity
# logs an error for every state without a cover URL). Needs, besides the ACL below: write on
# homeassistant/device/+/config and read on homeassistant/status. A discovery message needs
# a stable server id: SnapDog refuses to announce when it cannot persist it (state_dir).
# [mqtt.homeassistant]
# discovery = true
# discovery_prefix = "homeassistant"      # Home Assistant's discovery prefix
# status_topic = "homeassistant/status"   # Home Assistant's birth message

# Hardening the broker (Mosquitto shown; other brokers have the same knobs):
#   1. Listen on TLS only: no `listener 1883`; `listener 8883` with cafile/certfile/keyfile.
#      Leave `tls_version` unset, so that TLS 1.2 and 1.3 stay available (SnapDog asks for 1.2
#      or newer and takes the newest its platform's TLS library offers).
#   2. allow_anonymous false, one user per client (SnapDog, Home Assistant, ...), or
#      `require_certificate true` + `use_identity_as_username true` for certificate logins.
#   3. An ACL that confines SnapDog to its own base topic (acl_file), e.g. for base "snapdog/":
#        user snapdog
#        topic write snapdog/status
#        topic write snapdog/zones/+/state
#        topic write snapdog/clients/+/state
#        topic read  snapdog/zones/#
#        topic read  snapdog/clients/#
#        # Optional, to let SnapDog delete messages that old releases left behind
#        # (clear_legacy_topics; the second line only with clear_legacy_topics = true):
#        topic write snapdog//status
#        topic write homeassistant/media_player/+/config
#        # Only with [mqtt.homeassistant] (discovery true, or false to delete):
#        topic write homeassistant/device/+/config      # '+' must fill a whole level
#        topic read  homeassistant/status
#      and give whatever controls SnapDog (Home Assistant, a script) `topic write` on the
#      command topics and `topic read snapdog/#`. Commands have two and three levels below
#      the zone or client, so both patterns are needed:
#        topic write snapdog/zones/+/+/set        # volume, mute, control, shuffle, ...
#        topic write snapdog/zones/+/+/+/set      # presence/enable, presence/timeout, track/position
#        topic write snapdog/clients/+/+/set      # volume, mute, latency, zone
#      Everybody who may write one of these topics can control the audio.
#   4. A client that is refused a subscription shows up as a warning in SnapDog's log.

# ── KNX ────────────────────────────────────────────────────────────────────
# Remove this section entirely to disable KNX.
# [knx]
# Role: "client" (connect to gateway) or "device" (ETS-programmable)
# role = "client"
# KNX/IP gateway URL:
#   Client mode: "udp://192.168.1.50:3671" (tunnel) or multicast (router)
#   Device mode: optional, for forwarding GA traffic through a gateway
# url = "udp://192.168.1.50:3671"
# Device mode only: KNX individual address assigned by ETS
# individual_address = "1.1.100"
# Device mode only: start in programming mode (for initial ETS discovery)
# start_prog_mode = false

# ══════════════════════════════════════════════════════════════════════════════
# Zones
# ══════════════════════════════════════════════════════════════════════════════
# Each zone is an independent audio destination with its own AirPlay receiver,
# Spotify Connect instance, and Snapcast stream.

[[zone]]
name = "Ground Floor"
icon = "🏠"
# Override auto-generated Snapcast sink path:
# sink = "/snapsinks/zone1"
# Override auto-generated AirPlay receiver name:
# airplay_name = "Ground Floor (AirPlay)"

# Optional: presence-triggered playback
# [zone.presence]
# auto_off_delay = 900              # Seconds without presence before auto-off (default: 900)
# default_source = "radio:0"        # Fallback source when no schedule matches
# [[zone.presence.schedule]]        # Time-based source selection
# from = "06:00"
# to = "09:00"
# source = "radio:0"                # radio:<index>, playlist:<id>, or "none"

# Optional: KNX group addresses (client mode only, device mode uses ETS)
# [zone.knx]
# volume = "1/1/1"                  # DPT 5.001 — set volume (0–100%)
# volume_status = "1/1/2"           # DPT 5.001 — volume feedback
# volume_dim = "1/1/3"              # DPT 3.007 — relative dimming
# mute = "1/1/4"                    # DPT 1.001 — set mute
# mute_status = "1/1/5"            # DPT 1.001 — mute feedback
# mute_toggle = "1/1/6"            # DPT 1.001 — toggle mute
# play = "1/1/10"                   # DPT 1.001 — play
# pause = "1/1/11"                  # DPT 1.001 — pause
# stop = "1/1/12"                   # DPT 1.001 — stop
# track_next = "1/1/13"            # DPT 1.001 — next track
# track_previous = "1/1/14"        # DPT 1.001 — previous track
# control_status = "1/1/15"        # DPT 1.001 — playing status
# track_playing_status = "1/1/16"         # DPT 1.001 — track is playing
# track_title_status = "1/1/20"           # DPT 16.001 — current title (14 chars)
# track_artist_status = "1/1/21"          # DPT 16.001 — current artist
# track_album_status = "1/1/22"           # DPT 16.001 — current album
# track_progress_status = "1/1/23"        # DPT 5.001 — track progress (0–100%)
# shuffle = "1/1/30"               # DPT 1.001 — set shuffle
# shuffle_status = "1/1/31"        # DPT 1.001 — shuffle feedback
# shuffle_toggle = "1/1/32"        # DPT 1.001 — toggle shuffle
# repeat = "1/1/33"                # DPT 1.001 — set repeat
# repeat_status = "1/1/34"         # DPT 1.001 — repeat feedback
# repeat_toggle = "1/1/35"         # DPT 1.001 — toggle repeat
# playlist = "1/1/40"              # DPT 5.010 — set playlist index
# playlist_status = "1/1/41"       # DPT 5.010 — playlist index feedback
# playlist_next = "1/1/42"         # DPT 1.001 — next playlist
# playlist_previous = "1/1/43"     # DPT 1.001 — previous playlist
# presence = "1/1/50"              # DPT 1.001 — set presence
# presence_enable = "1/1/51"       # DPT 1.001 — enable/disable auto-off
# presence_enable_status = "1/1/52" # DPT 1.001 — auto-off enabled feedback
# presence_timeout = "1/1/53"      # DPT 7.005 — auto-off timeout (seconds)
# presence_timeout_status = "1/1/54" # DPT 7.005 — timeout feedback
# presence_timer_status = "1/1/55" # DPT 1.001 — timer running feedback

[[zone]]
name = "1st Floor"
icon = "🏠"

# ══════════════════════════════════════════════════════════════════════════════
# Clients (Speakers)
# ══════════════════════════════════════════════════════════════════════════════
# Each client is a physical speaker identified by its Snapcast MAC address.
# Clients are assigned to zones and can be moved at runtime via API/WebUI.

[[client]]
name = "Living Room"
mac = "02:42:ac:11:00:10"            # Snapcast client MAC (lowercase)
zone = "Ground Floor"                 # Initial zone assignment (by name)
icon = "🛋️"
# max_volume = 100                   # Volume limit (0–100, default 100)

# Optional: KNX group addresses (client mode only)
# [client.knx]
# volume = "3/1/1"                   # DPT 5.001 — set volume
# volume_status = "3/1/2"           # DPT 5.001 — volume feedback
# volume_dim = "3/1/3"             # DPT 3.007 — relative dimming
# mute = "3/1/4"                    # DPT 1.001 — set mute
# mute_status = "3/1/5"            # DPT 1.001 — mute feedback
# mute_toggle = "3/1/6"            # DPT 1.001 — toggle mute
# latency = "3/1/7"                # DPT 7.005 — set latency (ms)
# latency_status = "3/1/8"         # DPT 7.005 — latency feedback
# zone = "3/1/9"                    # DPT 5.010 — set zone index
# zone_status = "3/1/10"           # DPT 5.010 — zone feedback
# connected_status = "3/1/11"      # DPT 1.001 — connected feedback

[[client]]
name = "Kitchen"
mac = "02:42:ac:11:00:11"
zone = "Ground Floor"
icon = "🍽️"

[[client]]
name = "Bedroom"
mac = "02:42:ac:11:00:12"
zone = "1st Floor"
icon = "🛏️"

# ══════════════════════════════════════════════════════════════════════════════
# Radio Stations
# ══════════════════════════════════════════════════════════════════════════════
# Supports direct streams, M3U/PLS playlists, and HLS (master + media).
