# ══════════════════════════════════════════════════════════════════════════════
# SnapDog Configuration
# ══════════════════════════════════════════════════════════════════════════════
# Copy to snapdog.toml and adjust to your setup.
# All sections and fields are optional — sensible defaults are used.

# Server display name — mDNS service instance name, Home Assistant device name,
# and the "name" in GET /api/v1/system/version.
# name = "SnapDog"

# ── System ─────────────────────────────────────────────────────────────────
[system]
# Logging verbosity: trace, debug, info, warn, error
log_level = "info"
# Optional: also log to a file (in addition to stdout), one file per day. The date goes
# before the extension: snapdog.log becomes snapdog.2026-10-25.log. SnapDog keeps 14
# daily files (the current one and 13 more) and deletes older ones when a new day's
# file is created, so give it a directory of its own: files whose names start with
# "snapdog" and end with the same extension count as its logs. The day changes at
# midnight UTC, whatever the local time zone. If the file cannot be opened, SnapDog warns
# and keeps logging to stdout. A write error later (disk full) is not reported: the file
# then misses lines while stdout keeps working.
# The packaged systemd unit creates /var/log/snapdog for this (LogsDirectory=); with the
# unit's read-only file system no other directory is writable.
# log_file = "/var/log/snapdog/snapdog.log"
# Directory for persistent state files (zones.json, eq.json, server_id, and
# airplay-pairing with AirPlay 2). A leading ~ is expanded.
# Default: under systemd /var/lib/snapdog; Linux $XDG_STATE_HOME/snapdog or
# ~/.local/state/snapdog; macOS ~/Library/Application Support/SnapDog;
# Windows %LOCALAPPDATA%\SnapDog
# state_dir = "/var/lib/snapdog"

# ── Audio ──────────────────────────────────────────────────────────────────
[audio]
# Output sample rate in Hz. All sources are resampled to this rate.
sample_rate = 48000
# Output bit depth: 16, 24, or 32
bit_depth = 16
# Number of channels (2 = stereo)
channels = 2
# How to resolve conflicts when AirPlay/Spotify is active and local
# playback (radio/subsonic) is requested:
#   "last_wins" = most recent source takes over (default)
#   "receiver_wins" = AirPlay/Spotify blocks until it stops
source_conflict = "last_wins"
# Fade duration (ms) when a SnapDog client switches zones.
# The client fades out, switches, then fades in. Set to 0 to disable.
zone_switch_fade_ms = 300
# Fade duration (ms) when switching audio sources within a zone
# (e.g., radio → subsonic). Server-side fade-out then fade-in. 0 to disable.
source_switch_fade_ms = 300

# ── HTTP Server ────────────────────────────────────────────────────────────
[http]
# WebUI + REST API port
port = 5555
# Bind address. Default "::" (IPv4 and IPv6 where the OS allows); "0.0.0.0" for IPv4 only.
# bind = "::"
# External base URL for absolute links in API responses.
# Required if behind a reverse proxy or accessed from other hosts.
base_url = "http://192.168.1.10:5555"
# Optional: restrict API access with bearer tokens.
# If empty, all endpoints are open. WebUI and /health are always accessible.
# api_keys = ["my-secret-token"]
# Optional: TLS — enables HTTPS for REST API and WebUI.
# Both tls_cert and tls_key must be set together.
# tls_cert = "/etc/snapdog/tls/fullchain.pem"
# tls_key = "/etc/snapdog/tls/privkey.pem"
# API documentation (only in builds with the api-docs feature, which the release
# binaries have; other builds serve none of it).
# api_docs: serve the OpenAPI document at GET /api/v1/openapi.json. It is protected like
# the rest of /api/v1: with api_keys set it needs "Authorization: Bearer <key>", without
# keys it is open, like the API. Default true.
# api_docs = true
# api_console: also serve the interactive console at /docs. Off by default. A browser
# cannot send the Authorization header when it opens a page, so the page is NOT behind
# api_keys and embeds the whole OpenAPI document. Turn it on only on a network you trust.
# api_console = false

# ── Snapcast ───────────────────────────────────────────────────────────────
[snapcast]
# Audio streaming port (clients connect here). It carries the audio stream and has
# no authentication: whoever can reach it can connect as a client and receive the audio.
# Restrict it with streaming_bind below and the firewall; use codec "f32lz4e" with your
# own encryption_psk if the stream must not be readable on the network.
streaming_port = 1704
# Local address the streaming port listens on, one address: "192.168.10.5" for one
# interface, "127.0.0.1" for this host only. Unset: all interfaces. Clients that find the
# server with mDNS connect to the address mDNS resolves, so keep it reachable for them.
# streaming_bind = "192.168.10.5"
# Streaming codec: "pcm", "flac", "f32lz4", "f32lz4e" (encrypted)
codec = "flac"
# Pre-shared key for f32lz4e encryption (both server and client must match).
# Without a key the built-in default is used, which is public: the stream is then
# not protected, and SnapDog logs a warning. Also: SNAPDOG_SNAPCAST_ENCRYPTION_PSK.
# encryption_psk = "my-secret-key"
# How zone volume changes affect individual client volumes:
#   "absolute" = set all clients to the zone volume
#   "relative" = scale proportionally: client_volume * zone_volume / 100
#   "compressed" = square-root curve, quiet clients drop less (default)
group_volume_mode = "relative"
# Only for builds with the snapcast-process feature, which drive an external
# snapserver instead of the embedded Rust server (ignored, with a warning, otherwise):
# address = "127.0.0.1"     # host of the external snapserver
# jsonrpc_tcp_port = 1705   # its JSON-RPC port
# managed = true            # start snapserver as a child process (false: connect to a running one)
# verbose = false           # show the child process's console output
# Policy for unknown Snapcast clients (not in [[client]] config):
#   "accept" = assign to default_zone
#   "ignore" = allow connection but don't manage
#   "reject" = disconnect immediately
unknown_clients = "accept"
# Zone to assign unknown clients to (only used with "accept" policy)
default_zone = "Ground Floor"

# ── mDNS / Bonjour ────────────────────────────────────────────────────────
[mdns]
# Enable mDNS service advertisement (default: true)
# enabled = true
# Additionally advertise _snapcast._tcp for standard Snapcast client discovery
# advertise_snapcast = false

# ── D-Bus / MPRIS2 ────────────────────────────────────────────────────────
[dbus]
# Enable MPRIS2 D-Bus interface per zone (Linux only, default: true)
# enabled = true

# ── AirPlay ────────────────────────────────────────────────────────────────
[airplay]
# Protocol mode: "airplay2" (default) or "airplay1" for legacy compatibility.
# Only effective in builds with AirPlay 2 support (feature ap2); other builds use AirPlay 1.
# mode = "airplay2"
# Optional: require password for AirPlay connections
# password = "1234"
# Optional: listen on specific IP addresses (not interface names). Default: all.
# Only effective in builds with AirPlay 2 support (feature ap2).
# bind = ["192.168.1.10"]

# ── Spotify Connect ────────────────────────────────────────────────────────
# Remove this section entirely to disable Spotify Connect.
[spotify]
# The device name in the Spotify app is the zone's spotify_name (default: the zone name),
# set per [[zone]] below. A [spotify].name key is ignored.
# Spotify streaming bitrate: 96, 160, or 320 kbps
bitrate = 320

# ── Subsonic / Navidrome ───────────────────────────────────────────────────
# Remove this section entirely to disable Subsonic integration.
[subsonic]
url = "http://navidrome:4533"
username = "admin"
password = "admin"
# Transcoding format: "raw" (original), "flac", "mp3", "opus"
# format = "raw"
# Skip TLS certificate verification (for self-signed certs)
# tls_skip_verify = false

# Track cache — always active for instant seek and replay. A leading ~ is expanded.
# [subsonic.cache]
# path = "~/.cache/snapdog/tracks"  # Cache directory (default: platform-appropriate)
# max_size_mb = 2048                # Max cache size (LRU eviction)

# ── MQTT ───────────────────────────────────────────────────────────────────
# Remove this section entirely to disable MQTT.
[mqtt]
broker = "192.168.1.10:1883"
# client_id = "snapdog"            # MQTT client ID (must be unique per broker)
# username = "snapdog"
# password = "snapdog"
# Base topic prefix. All topics are published/subscribed under this prefix.
base_topic = "snapdog"

# ── KNX ────────────────────────────────────────────────────────────────────
# Remove this section entirely to disable KNX.
# [knx]
# The presence of this table switches KNX on; there is no "enabled" key.
# Role: "client" (connect to gateway) or "device" (ETS-programmable)
# role = "client"
# KNX/IP gateway URL, required in client mode and not used in device mode.
# Must be scheme://IP:port (no host names): udp:// picks tunnelling for a unicast
# address and routing for a multicast one; tunnel:// and router:// force a mode.
# url = "udp://192.168.1.50:3671"
# Device mode only: KNX individual address assigned by ETS
# individual_address = "1.1.100"
# Device mode only: start in programming mode (for initial ETS discovery)
# start_prog_mode = false
# Device mode only: keep ETS programming across restarts (default true) and restart
# to apply new parameters after an ETS download (default true)
# persist_ets_config = true
# restart_after_ets = true
# Minutes between heartbeat telegrams (server_online, system_fault). Default 5.
# heartbeat_minutes = 5
# Set the operating system clock from the knx_time telegram (needs privilege). Default false.
# sync_system_clock = false
# Device-level group addresses:
# server_online = "2/1/1"    # DPT 1.011 — heartbeat, true at start and every heartbeat_minutes
# all_stop = "2/1/2"         # DPT 1.017 — stop all zones
# all_mute = "2/1/3"         # DPT 1.001 — mute/unmute all zones
# all_mute_status = "2/1/4"  # DPT 1.001 — true when every zone is muted
# system_fault = "2/1/5"     # DPT 1.005 — true while the Snapcast link is down
# knx_time = "2/1/6"         # DPT 10.001 — clock input (drives presence schedules)

# ══════════════════════════════════════════════════════════════════════════════
# Zones
# ══════════════════════════════════════════════════════════════════════════════
# Each zone is an independent audio destination with its own AirPlay receiver,
# Spotify Connect instance, and Snapcast stream.

[[zone]]
name = "Ground Floor"
icon = "🏠"
# Override auto-generated Snapcast sink path:
# sink = "/snapsinks/zone1"
# Override auto-generated AirPlay receiver name:
# airplay_name = "Ground Floor (AirPlay)"
# Name shown in the Spotify app (default: the zone name):
# spotify_name = "Ground Floor (Spotify)"

# Optional: presence-triggered playback
# [zone.presence]
# auto_off_delay = 900              # Seconds without presence before auto-off (default: 900)
# default_source = "radio:0"        # Fallback source when no schedule matches
# [[zone.presence.schedule]]        # Time-based source selection
# from = "06:00"
# to = "09:00"
# source = "radio:0"                # radio:<index>, playlist:<id>, or "none"

# Optional: KNX group addresses (33 group objects per zone).
# [zone.knx]
# volume = "1/1/1"                  # DPT 5.001 — set volume (0–100%)
# volume_status = "1/1/2"           # DPT 5.001 — volume feedback
# volume_dim = "1/1/3"              # DPT 3.007 — relative dimming
# mute = "1/1/4"                    # DPT 1.001 — set mute
# mute_status = "1/1/5"            # DPT 1.001 — mute feedback
# mute_toggle = "1/1/6"            # DPT 1.001 — toggle mute
# play = "1/1/10"                   # DPT 1.001 — play
# pause = "1/1/11"                  # DPT 1.001 — pause
# stop = "1/1/12"                   # DPT 1.001 — stop
# track_next = "1/1/13"            # DPT 1.001 — next track
# track_previous = "1/1/14"        # DPT 1.001 — previous track
# control_status = "1/1/15"        # DPT 1.001 — playing status
# track_playing_status = "1/1/16"         # DPT 1.001 — track is playing
# track_title_status = "1/1/20"           # DPT 16.001 — current title (14 chars)
# track_artist_status = "1/1/21"          # DPT 16.001 — current artist
# track_album_status = "1/1/22"           # DPT 16.001 — current album
# track_progress_status = "1/1/23"        # DPT 5.001 — track progress (0–100%)
# shuffle = "1/1/30"               # DPT 1.001 — set shuffle
# shuffle_status = "1/1/31"        # DPT 1.001 — shuffle feedback
# shuffle_toggle = "1/1/32"        # DPT 1.001 — toggle shuffle
# repeat = "1/1/33"                # DPT 1.001 — set playlist repeat
# repeat_status = "1/1/34"         # DPT 1.001 — playlist repeat feedback
# repeat_toggle = "1/1/35"         # DPT 1.001 — cycle repeat: off, playlist, track
# track_repeat = "1/1/36"          # DPT 1.001 — set single-track repeat
# track_repeat_status = "1/1/37"   # DPT 1.001 — single-track repeat feedback
# track_repeat_toggle = "1/1/38"   # DPT 1.001 — cycle repeat: off, playlist, track
# playlist = "1/1/40"              # DPT 5.010 — set playlist index
# playlist_status = "1/1/41"       # DPT 5.010 — playlist index feedback
# playlist_next = "1/1/42"         # DPT 1.001 — next playlist
# playlist_previous = "1/1/43"     # DPT 1.001 — previous playlist
# presence = "1/1/50"              # DPT 1.018 — set presence
# presence_enable = "1/1/51"       # DPT 1.001 — enable/disable auto-off
# presence_enable_status = "1/1/52" # DPT 1.001 — auto-off enabled feedback
# presence_timer_status = "1/1/55" # DPT 1.001 — timer running feedback
# (The auto-off delay is not a group object: set auto_off_delay in [zone.presence].)

[[zone]]
name = "1st Floor"
icon = "🏠"

# ══════════════════════════════════════════════════════════════════════════════
# Clients (Speakers)
# ══════════════════════════════════════════════════════════════════════════════
# Each client is a physical speaker identified by its Snapcast MAC address.
# Clients are assigned to zones and can be moved at runtime via API/WebUI.

[[client]]
name = "Living Room"
mac = "02:42:ac:11:00:10"            # Snapcast client MAC (lowercase)
zone = "Ground Floor"                 # Initial zone assignment (by name)
icon = "🛋️"
# max_volume = 100                   # Volume limit (0–100, default 100)

# Optional: KNX group addresses (11 group objects per client).
# [client.knx]
# volume = "3/1/1"                   # DPT 5.001 — set volume
# volume_status = "3/1/2"           # DPT 5.001 — volume feedback
# volume_dim = "3/1/3"             # DPT 3.007 — relative dimming
# mute = "3/1/4"                    # DPT 1.001 — set mute
# mute_status = "3/1/5"            # DPT 1.001 — mute feedback
# mute_toggle = "3/1/6"            # DPT 1.001 — toggle mute
# latency = "3/1/7"                # DPT 5.010 — set latency (0–255 ms)
# latency_status = "3/1/8"         # DPT 5.010 — latency feedback
# zone = "3/1/9"                    # DPT 5.010 — set zone index
# zone_status = "3/1/10"           # DPT 5.010 — zone feedback
# connected_status = "3/1/11"      # DPT 1.001 — connected feedback

[[client]]
name = "Kitchen"
mac = "02:42:ac:11:00:11"
zone = "Ground Floor"
icon = "🍽️"

[[client]]
name = "Bedroom"
mac = "02:42:ac:11:00:12"
zone = "1st Floor"
icon = "🛏️"

